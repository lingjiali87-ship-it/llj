function toast(t){var el=document.getElementById('wo151Toast');if(!el)return;el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},2100);}
function cards(){return Array.prototype.slice.call(document.querySelectorAll('#content .card'));}
function cardData(c){var im=c.querySelector('.poster img'),name=c.querySelector('.name');return {el:c,title:name?name.textContent.trim():'未命名作品',pic:im?(im.currentSrc||im.src):'',href:c.getAttribute('data-href')||'',year:(c.querySelector('.poster-year')||{}).textContent||'',update:(c.querySelector('.poster-update')||{}).textContent||'',text:c.innerText||''};}
function openMask(title,body){var m=document.getElementById('wo151Mask');m.querySelector('.wo151-modal').innerHTML='<h3>'+title+'</h3><div class="wo151-muted">玩偶盘搜 · 探索空间</div>'+body+'<div class="wo151-row" style="justify-content:flex-end"><button class="wo151-secondary" data-close>关闭</button></div>';m.classList.add('on');}
function closeMask(){document.getElementById('wo151Mask').classList.remove('on');}
function goCard(c){if(!c)return;try{c.scrollIntoView({behavior:'smooth',block:'center'});c.style.transition='box-shadow .3s,transform .3s';c.style.boxShadow='0 0 0 2px rgba(114,239,255,.95),0 0 30px rgba(65,194,255,.65)';c.style.transform='scale(1.025)';setTimeout(function(){c.style.boxShadow='';c.style.transform='';},1400);c.click();}catch(e){}}
function addDiscovery(){if(document.getElementById('wo151Discovery'))return;var content=document.getElementById('content');if(!content)return;var box=document.createElement('section');box.className='wo151-discovery';box.id='wo151Discovery';box.innerHTML='<div class="wo151-head"><div><strong>✦ 影视探索空间</strong><br><small>不只搜索，也发现下一部喜欢的作品</small></div><small id="wo151Count">探索待命</small></div><div class="wo151-rail"><button class="wo151-action" data-tool="radar"><span>📡</span>影视雷达<em>按偏好筛选</em></button><button class="wo151-action" data-tool="blind"><span>🌀</span>片海盲盒<em>未知作品揭晓</em></button><button class="wo151-action" data-tool="time"><span>⏳</span>时光胶囊<em>按年份探索</em></button><button class="wo151-action" data-tool="treasure"><span>💎</span>片海寻宝<em>发现隐藏选择</em></button><button class="wo151-action" data-tool="today"><span>🌌</span>今日发现<em>换个角度看剧</em></button></div><div class="wo151-tools"><button class="wo151-tool" data-tool="favorites">♥ 我的片单</button><button class="wo151-tool" data-tool="history">✧ 探索足迹</button><button class="wo151-tool" data-tool="categories">▦ 分类探索</button></div>';
content.parentNode.insertBefore(box,content);}
function modalResult(d,tag){return '<div class="wo151-result">'+(d.pic?'<img src="'+esc(d.pic)+'" loading="lazy">':'<div style="width:70px;height:100px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center">🎬</div>')+'<div><b>'+esc(d.title)+'</b><small>'+esc(d.year||'年份未知')+' · '+esc(d.update||tag||'已为你发现')+'</small><div class="wo151-row"><button class="wo151-primary" data-open="'+esc(d.title)+'">查看作品</button><button class="wo151-secondary" data-fav="'+esc(d.title)+'">♡ 收藏</button></div></div></div>';}
function track(d,kind){state.explored=state.explored||[];state.explored.unshift({title:d.title,kind:kind,at:Date.now()});state.explored=state.explored.slice(0,30);save();}
function randomFrom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function tool(name){var list=cards().map(cardData),body='';if(!list.length){openMask('影视探索', '<p class="wo151-muted">当前还没有可探索的影视卡片。请先加载作品列表或进行一次搜索。</p>');return;}
if(name==='radar'){openMask('📡 影视雷达','<p class="wo151-muted">选择一个探索方向，雷达会从当前已加载的作品中匹配。数据来自当前页面，不会伪造全站热度。</p><div class="wo151-row" id="wo151Types"><button class="wo151-pill on" data-v="全部">全部</button><button class="wo151-pill" data-v="电影">电影</button><button class="wo151-pill" data-v="剧集">剧集</button><button class="wo151-pill" data-v="动漫">动漫</button></div><div class="wo151-row" id="wo151Genres"><button class="wo151-pill on" data-v="全部">全部题材</button><button class="wo151-pill" data-v="高分">高分优先</button><button class="wo151-pill" data-v="新作">新作优先</button><button class="wo151-pill" data-v="未探索">未探索</button></div><button class="wo151-primary" data-run="radar">开始扫描</button><div id="wo151ScanResult"></div>');return;}
if(name==='blind'||name==='treasure'||name==='today'){var title=name==='blind'?'🌀 片海盲盒':name==='treasure'?'💎 片海寻宝':'🌌 今日发现';var d=randomFrom(list);track(d,name);body='<p class="wo151-muted">'+(name==='blind'?'不看排行榜，从当前作品里抽一部。':name==='treasure'?'从当前列表里随机挖掘一部，发现不一样的选择。':'根据当前已经加载的作品，为你换一个发现角度。')+'</p><div class="wo151-scan"><i></i></div><div id="wo151Reveal">'+modalResult(d,'探索发现')+'</div><div class="wo151-row"><button class="wo151-primary" data-reroll="'+name+'">再发现一部 ↻</button><button class="wo151-secondary" data-tool="history">探索足迹</button></div>';openMask(title,body);return;}
if(name==='time'){var years={};list.forEach(function(d){var y=(d.year||'').match(/20\d{2}|19\d{2}/);if(y)(years[y[0]]||(years[y[0]]=[])).push(d);});var ys=Object.keys(years).sort().reverse();body='<p class="wo151-muted">选择年份，浏览当前已加载作品中的对应年份。若作品没有年份信息，将不会被强行归类。</p><div class="wo151-row" id="wo151Years">'+(ys.length?ys.slice(0,16).map(function(y,i){return '<button class="wo151-pill '+(!i?'on':'')+'" data-year="'+y+'">'+y+'</button>';}).join(''):'<span class="wo151-muted">当前作品暂无可识别年份</span>')+'</div><div id="wo151YearResult"></div>';openMask('⏳ 时光胶囊',body);if(ys.length)showYear(ys[0]);return;}
if(name==='favorites'){var fav=list.filter(function(d){return state.fav.indexOf(d.title)>=0;});openMask('♥ 我的片单','<p class="wo151-muted">已收藏 '+state.fav.length+' 部。片单保存在当前浏览器。</p>'+(fav.length?fav.map(function(d){return modalResult(d,'已收藏');}).join(''):'<p class="wo151-muted">还没有收藏作品。点击海报下方的♡快捷按钮即可收藏。</p>'));return;}
if(name==='history'){var hs=state.explored||[];openMask('✧ 探索足迹','<p class="wo151-muted">最近探索记录（最多保存 30 条）。</p>'+(hs.length?hs.map(function(x){return '<div class="wo151-result"><div style="font-size:25px">✦</div><div><b>'+esc(x.title)+'</b><small>'+esc(x.kind)+' · '+new Date(x.at).toLocaleString()+'</small></div></div>';}).join(''):'<p class="wo151-muted">还没有探索记录，试试影视雷达或片海盲盒。</p>')+'<button class="wo151-secondary" data-clear-history>清空足迹</button>');return;}
if(name==='categories'){var chips=Array.prototype.slice.call(document.querySelectorAll('#chips .chip')).map(function(c){return c.textContent.trim();}).filter(Boolean);openMask('▦ 分类探索','<p class="wo151-muted">选择分类，直接使用页面已有的分类按钮。</p><div class="wo151-row">'+chips.map(function(c){return '<button class="wo151-pill" data-category="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+'</div>');}
}
function showYear(y){var list=cards().map(cardData).filter(function(d){return d.year.indexOf(y)>=0;});var el=document.getElementById('wo151YearResult');if(el)el.innerHTML='<p class="wo151-muted">'+y+' 年 · 找到 '+list.length+' 部当前已加载作品</p>'+list.slice(0,6).map(function(d){return modalResult(d,'时光胶囊');}).join('')+(list.length>6?'<p class="wo151-muted">还有 '+(list.length-6)+' 部，可在原列表继续浏览。</p>':'');}
function runRadar(){var list=cards().map(cardData),type=document.querySelector('#wo151Types .on'),genre=document.querySelector('#wo151Genres .on');var t=type?type.dataset.v:'全部',g=genre?genre.dataset.v:'全部';list=list.filter(function(d){if(t==='电影'&&!/电影/.test(d.text+' '+d.title))return false;if(t==='剧集'&&!/剧|集|季/.test(d.text+' '+d.title))return false;if(t==='动漫'&&!/动漫|动画/.test(d.text+' '+d.title))return false;if(g==='新作'&&!/202[4-9]|202[0-9]/.test(d.year))return false;if(g==='未探索'&&(state.explored||[]).some(function(x){return x.title===d.title;}))return false;return true;});if(g==='高分')list.sort(function(a,b){return (parseFloat(b.text.match(/[★⭐]\s*(\d+(?:\.\d+)?)/)||[] [1])||0)-(parseFloat(a.text.match(/[★⭐]\s*(\d+(?:\.\d+)?)/)||[] [1])||0);});var out=document.getElementById('wo151ScanResult');if(!out)return;out.innerHTML='<div class="wo151-scan"><i></i></div><p class="wo151-muted">扫描完成：在当前已加载的作品中匹配到 '+list.length+' 部。</p>'+(list.length?list.slice(0,3).map(function(d){track(d,'影视雷达');return modalResult(d,'雷达发现');}).join(''):'<p class="wo151-muted">没有匹配项，试试更宽泛的条件，或先加载更多作品。</p>');}
function decorateCards(){cards().forEach(function(c){if(c.dataset.wo151Ready)return;c.dataset.wo151Ready='1';var d=cardData(c),actions=document.createElement('div');actions.className='wo151-card-actions';actions.innerHTML='<button data-card-fav="'+esc(d.title)+'">'+(state.fav.indexOf(d.title)>=0?'♥ 已收藏':'♡ 收藏')+'</button><button data-card-status="想看" data-title="'+esc(d.title)+'">＋ 想看</button>';var meta=c.querySelector('.meta');if(meta)meta.appendChild(actions);});}
document.addEventListener('click',function(e){var b=e.target.closest('[data-tool]');if(b){e.preventDefault();tool(b.dataset.tool);return;}if(e.target.closest('[data-close]')){closeMask();return;}var pill=e.target.closest('#wo151Types .wo151-pill,#wo151Genres .wo151-pill');if(pill){pill.parentNode.querySelectorAll('.wo151-pill').forEach(function(x){x.classList.remove('on');});pill.classList.add('on');return;}if(e.target.closest('[data-run="radar"]')){runRadar();return;}var yr=e.target.closest('[data-year]');if(yr){yr.parentNode.querySelectorAll('.wo151-pill').forEach(function(x){x.classList.remove('on');});yr.classList.add('on');showYear(yr.dataset.year);return;}var rer=e.target.closest('[data-reroll]');if(rer){var ls=cards().map(cardData);if(ls.length){var d=randomFrom(ls);track(d,rer.dataset.reroll);var out=document.getElementById('wo151Reveal');if(out)out.innerHTML=modalResult(d,'重新发现');}return;}var fav=e.target.closest('[data-card-fav],[data-fav]');if(fav){var title=fav.dataset.cardFav||fav.dataset.fav;if(state.fav.indexOf(title)>=0){state.fav=state.fav.filter(function(x){return x!==title;});toast('已取消收藏');}else{state.fav.push(title);toast('已加入我的片单');}save();document.querySelectorAll('[data-card-fav]').forEach(function(x){if(x.dataset.cardFav===title)x.textContent=state.fav.indexOf(title)>=0?'♥ 已收藏':'♡ 收藏';});if(fav.dataset.fav)fav.textContent=state.fav.indexOf(title)>=0?'♥ 已收藏':'♡ 收藏';return;}var st=e.target.closest('[data-card-status]');if(st){state.status=state.status||{};state.status[st.dataset.title]=st.dataset.cardStatus||st.dataset.status||'想看';save();toast('已标记：'+st.dataset.status);return;}var op=e.target.closest('[data-open]');if(op){var title=op.dataset.open,c=cards().find(function(x){return (x.querySelector('.name')||{}).textContent.trim()===title;});closeMask();if(c)goCard(c);return;}var cat=e.target.closest('[data-category]');if(cat){var name=cat.dataset.category,real=Array.prototype.slice.call(document.querySelectorAll('#chips .chip')).find(function(x){return x.textContent.trim()===name;});closeMask();if(real)real.click();return;}if(e.target.closest('[data-clear-history]')){state.explored=[];save();tool('history');return;}if(e.target.id==='wo151Mask')closeMask();});
function init(){addDiscovery();decorateCards();var cnt=document.getElementById('wo151Count');if(cnt)cnt.textContent=cards().length+' 部已加载';}
var observer=new MutationObserver(function(){addDiscovery();decorateCards();var cnt=document.getElementById('wo151Count');if(cnt)cnt.textContent=cards().length+' 部已加载';});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();observer.observe(document.getElementById('content')||document.body,{childList:true,subtree:true});
var mask=document.createElement('div');mask.className='wo151-mask';mask.id='wo151Mask';mask.innerHTML='<div class="wo151-modal"></div>';document.body.appendChild(mask);var ts=document.createElement('div');ts.className='wo151-toast';ts.id='wo151Toast';document.body.appendChild(ts);
})();
</script>


<style id="wo153-cleanup-controls">
/* 15.3：按用户标记移除首页快捷入口、海报心形按钮与卡片下方收藏/想看按钮；不改动功能逻辑及其他布局 */
.v15-tools:has(#v15-random-top),
#v15-random-top, #v15-favs-top, #v15-achieve-top,
.v15-fav, .wo151-card-actions { display:none !important; }
</style>
