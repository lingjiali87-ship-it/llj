.card{content-visibility:auto;contain-intrinsic-size:180px 270px;
  background:transparent;
  border:0;
  border-radius:0;
  overflow:visible;
  cursor:pointer;
  position:relative;
  box-shadow:none;
  transition:transform .32s cubic-bezier(.34,1.4,.5,1);
  will-change:transform;
}
.card::before{display:none !important;content:none !important}
.card:active{
  transform:scale(0.97);
  transition-duration:.12s;
  transition-timing-function:cubic-bezier(.4,0,.2,1);
}
.card,.card *{
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}

.grid,.card,.poster{
  touch-action:pan-y!important;
  overscroll-behavior-x:none!important;
}
.content-scroll,.grid{
  isolation:isolate;
}
.card img{-webkit-user-drag:none;user-drag:none}
.poster{

  position:relative;
  overflow:hidden;
  background:#1c1c1e;
  border-radius:0;
  box-shadow:
    0 2px 4px rgba(0,0,0,.2),

}
.card:active .poster{

}

  transition:transform .55s cubic-bezier(.22,1,.36,1), opacity .35s cubic-bezier(.22,1,.36,1);
  display:block;position:absolute;inset:0;z-index:0;
}
.poster::before{
  content:'';position:absolute;left:0;right:0;bottom:0;height:36%;

}

.poster{border-radius:15px!important;overflow:hidden!important;background:linear-gradient(135deg,#17243a,#0b1220)!important;box-shadow:0 7px 20px rgba(0,0,0,.24),0 0 0 1px rgba(180,210,255,.08);}

/* 年份、评分标签：暗底高对比，统一边界 */

.det-loading{
  min-height:48vh!important;

const SITE_DOMAINS_DEFAULT={};

const SITE_DOMAIN_OVERRIDES=(()=>{try{return JSON.parse(localStorage.getItem('wo_site_domains')||'{}')}catch(e){return {}}})();
function _applySiteDomainOverrides(){
  SITES.forEach(s=>{
    const ov=SITE_DOMAIN_OVERRIDES[s.id];
    if(Array.isArray(ov)&&ov.length){
      s.domains=ov.map(d=>String(d||'').trim().replace(/\/+$/,'')).filter(Boolean);
    }else{
      s.domains=(SITE_DOMAINS_DEFAULT[s.id]||[]).slice();
    }
  });
}

function saveSiteDomains(siteId, domains){
  const list=(domains||[]).map(d=>String(d||'').trim().replace(/\/+$/,'')).filter(Boolean);
  if(!list.length){
    delete SITE_DOMAIN_OVERRIDES[siteId];
  }else{
    SITE_DOMAIN_OVERRIDES[siteId]=list;
  }
  try{ localStorage.setItem('wo_site_domains', JSON.stringify(SITE_DOMAIN_OVERRIDES)); }catch(e){}
  const s=SITES.find(x=>x.id===siteId);
  if(s){
    s.domains=list.length ? list.slice() : (SITE_DOMAINS_DEFAULT[siteId]||[]).slice();
  }
  try{ delete CATS_CACHE[siteId]; }catch(e){}
  try{ delete SEARCH_URL_CACHE[siteId]; _saveSearchUrlCache(); }catch(e){}
}

function openSiteDomainConfig(){
  return new Promise(resolve=>{
    const mask=document.getElementById('siteDomainMask');
    const input=document.getElementById('siteDomainInput');
    const titleEl=document.getElementById('siteDomainTitle');
    const okBtn=document.getElementById('siteDomainOk');
    const cancelBtn=document.getElementById('siteDomainCancel');
    const resetBtn=document.getElementById('siteDomainReset');
    if(!mask||!input){resolve(false);return}
    const s=site();
    if(titleEl) titleEl.textContent=(s.name||'站源')+' · 域名设置';
    // 打开时只显示用户保存的自定义域名
    // 空白代表使用站源内置默认域名，不主动显示默认列表
    const savedDomains=SITE_DOMAIN_OVERRIDES[s.id];
    input.value=(Array.isArray(savedDomains)?savedDomains:[]).join("\n");
    const domainList=document.getElementById("siteDomainList");
    if(domainList){domainList.style.display="none";domainList.innerHTML="";}
    
    mask.classList.add('show');
    requestAnimationFrame(()=>{ try{input.focus()}catch(e){} });
    let done=false;
    const finish=(ok, reset)=>{
      if(done)return; done=true;
      mask.classList.remove('show');
      okBtn.onclick=null; cancelBtn.onclick=null; mask.onclick=null; resetBtn.onclick=null;
      if(domainList){domainList.onclick=null;}
      input.onkeydown=null;
      if(ok){
        let list;
        if(reset){
          list=(SITE_DOMAINS_DEFAULT[s.id]||[]).slice();
          saveSiteDomains(s.id, []); // 清掉覆盖，走默认
          s.domains=list.slice();
        }else{
          list=input.value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
          // 自动补协议
          list=list.map(u=>{
            if(!/^https?:\/\//i.test(u)) u='https://'+u.replace(/^\/+/, '');
            return u.replace(/\/+$/,'');
          });
          // 保存空白：代表删除自定义域名
          // 不显示默认域名，空白状态由程序内部调用站源默认域名
          if(!list.length){
            saveSiteDomains(s.id, []);
          }else{
            saveSiteDomains(s.id, list);
          }
        }
        resolve(true);
      }else resolve(false);
    };
    okBtn.onclick=()=>finish(true,false);
    cancelBtn.onclick=()=>finish(false);
    resetBtn.onclick=()=>{
      if(!domainList)return;
      const arr=SITE_DOMAINS_DEFAULT[s.id]||[];
      domainList.innerHTML='';
      arr.forEach(function(d){
        const b=document.createElement('button');
        b.type='button';
        b.className='custom-modal-btn';
        b.style.width='100%';
        b.style.display='block';
        b.style.textAlign='left';
        b.style.whiteSpace='normal';
        b.style.wordBreak='break-all';
        b.textContent=d;
        b.onclick=function(){ input.value=d; };
        domainList.appendChild(b);
      });
      domainList.style.display='flex';
    };
    mask.onclick=(e)=>{ if(e.target===mask) finish(false); };
    input.onkeydown=(e)=>{
      if(e.key==='Escape'){ e.preventDefault(); finish(false); }
    };
  });
}

// ===== 自绘输入弹窗：替代原生 prompt()，避免浏览器自带的“网址为 xxx 的网页显示”样式 =====
function customPrompt(title,defaultValue){
  return new Promise(resolve=>{
    const mask=$('#panCfgMask'),input=$('#panCfgInput'),okBtn=$('#panCfgOk'),cancelBtn=$('#panCfgCancel'),titleEl=mask&&mask.querySelector('.custom-modal-title');
    if(!mask){resolve(null);return}
    const typeCfg=$('#panTypeCfg'); if(typeCfg) typeCfg.style.display='none';
    if(titleEl) titleEl.textContent=title||'';
    input.value=defaultValue||'';
    mask.classList.add('show');
    requestAnimationFrame(()=>{input.focus();input.select()});
    let done=false;
    const finish=(val)=>{
      if(done)return;done=true;
      mask.classList.remove('show');
      okBtn.onclick=null;cancelBtn.onclick=null;mask.onclick=null;input.onkeydown=null;
      resolve(val);
    };
    okBtn.onclick=()=>finish(input.value);
    cancelBtn.onclick=()=>finish(null);
    mask.onclick=(e)=>{ if(e.target===mask) finish(null); };
    input.onkeydown=(e)=>{
      if(e.key==='Enter'){e.preventDefault();finish(input.value)}
      else if(e.key==='Escape'){e.preventDefault();finish(null)}
    };
  });
}

function toggleFav(item){
  const idx = favList.findIndex(x=>x.href===item.href);
  const willFav = idx<0;
  if(idx>-1) favList.splice(idx,1);
  else favList.unshift(item);
  saveFav();
  // 正在浏览“收藏”分类时，取消收藏需从列表移除并重渲染
  if(content.dataset.mode==='category' && activeCat==='fav'){
    // 延后一帧重建网格：避免在手指仍按住（长按触发）时同步拆除被触摸的卡片，
    // 否则会残留卡片的 :active 缩放态并导致后续点击无响应
    status.textContent='我的收藏 · '+favList.length+' 条';
    requestAnimationFrame(()=>{
      if(activeCat==='fav'){renderGrid(favList,false);content.dataset.mode='category'}

    [...content.querySelectorAll('.card')].forEach(c=>{
      if(c.dataset.href===item.href) c.classList.toggle('is-fav',willFav);

// ===== 域名请求逻辑 =====
// 不进行测速、不显示延迟、不自动选择最快域名。
// 有自定义域名时由上层配置提供；没有自定义时使用站源默认 domains。
// ===== 多域名故障切换：严格按配置列表顺序尝试，不记录最近成功域名 =====
async function get(site,path,timeoutSec=16,quiet=false){
  const domains=(site.domains||[]).map(d=>String(d||'').replace(/\/+$/,'')).filter(Boolean);
  let requestPath=path;
  // 若详情链接来自该站点的某个域名，将它转换为相对路径，允许故障时换到备用域名。
  if(/^https?:\/\//i.test(path)&&domains.length){
    try{
      const u=new URL(path);
      const matched=domains.some(d=>{try{return new URL(d).host.toLowerCase()===u.host.toLowerCase()}catch(e){return false}});
      if(matched)requestPath=u.pathname+u.search+u.hash;
    }catch(e){}
  }
  if(/^https?:\/\//i.test(requestPath)){
    const began=Date.now();
    let h=await req(requestPath,Math.min(timeoutSec,8),quiet);
    if(!h||/just a moment|cf-browser|access denied/i.test(h))throw new Error('响应被拦截或为空');
    let base=requestPath;try{const u=new URL(requestPath);base=u.protocol+'//'+u.host}catch(e){}
    return{html:h,base};
  }
  if(!domains.length)throw new Error('没有可用域名');
  let lastErr='';
  // 按配置列表顺序逐个尝试；单个域名最多等待 8 秒，失败/超时后切换下一条。
  for(const d of domains){
    const began=Date.now();
    try{
      const base=d.replace(/\/+$/,''),u=base+(requestPath.startsWith('/')?requestPath:'/'+requestPath);
      const h=await req(u,Math.min(timeoutSec,8),quiet);
      if(h&&!/just a moment|cf-browser|access denied/i.test(h)){
        return{html:h,base};
      }
      lastErr='响应被拦截或无响应';
    }catch(e){lastErr=e.message||'请求失败';}
  }
  throw new Error(lastErr||'全部域名失败');
}

function stripTitleNoise(t){
  const orig=String(t||'').trim();
  let r=orig
    .replace(/^[【\[]?(?:立即|立刻|马上|火速|超清|高清|蓝光)?(?:播放|观看|看片|点播|追剧)(?:[：:、\s]+)?/,'')
    .replace(/^(?:在线观看|在线播放|免费观看|免费播放)(?:[：:、\s]+)?/,'')
    .trim();
  // 保护：若清洗后为空，或剩余内容过短（≤1字，疑似把片名也吃掉了），则保留原标题
  if(!r||r.length<=1)return orig;
  return r;
}

function jinpaiSha1Sync(str){
  function rotl(n,s){return(n<<s)|(n>>>32-s)}
  function toHex(i){let h='';for(let b=7;b>=0;b--)h+=((i>>(b*4))&0xf).toString(16);return h}
  str=unescape(encodeURIComponent(str));
  const words=[];
  for(let i=0;i<str.length;i++) words[i>>2]|=str.charCodeAt(i)<<((3-i%4)*8);
  const l=str.length*8;
  words[l>>5]|=0x80<<(24-l%32);
  words[((l+64>>9)<<4)+15]=l;
  let H0=0x67452301,H1=0xEFCDAB89,H2=0x98BADCFE,H3=0x10325476,H4=0xC3D2E1F0;
  const w=new Array(80);
  for(let i=0;i<words.length;i+=16){
    let a=H0,b=H1,c=H2,d=H3,e=H4;
    for(let j=0;j<80;j++){
      w[j]=j<16?words[i+j]|0:rotl(w[j-3]^w[j-8]^w[j-14]^w[j-16],1);
      let f,k;
      if(j<20){f=(b&c)|(~b&d);k=0x5A827999}
      else if(j<40){f=b^c^d;k=0x6ED9EBA1}
      else if(j<60){f=(b&c)|(b&d)|(c&d);k=0x8F1BBCDC}
      else{f=b^c^d;k=0xCA62C1D6}
      const temp=(rotl(a,5)+f+e+k+w[j])|0;
      e=d;d=c;c=rotl(b,30);b=a;a=temp;
    }
    H0=H0+a|0;H1=H1+b|0;H2=H2+c|0;H3=H3+d|0;H4=H4+e|0;
  }
  return toHex(H0)+toHex(H1)+toHex(H2)+toHex(H3)+toHex(H4);
}

function jinpaiPickBestUrl(list){
  const arr=(list||[]).filter(x=>x&&x.url);
  if(!arr.length)return null;
  arr.sort((a,b)=>(b.resolution|0)-(a.resolution|0));
  return arr[0];
}

async function jinpaiEpisodeUrl(s,vodId,nid){
  const r=await jinpaiApi(s,'/anonymous/v2/video/episode/url',{id:String(vodId),nid:String(nid),clientType:1},{play:true});
  const list=(r&&r.data&&r.data.list)||[];
  const best=jinpaiPickBestUrl(list);
  if(!best)return null;
  return{url:best.url,resolution:best.resolution,resolutionName:best.resolutionName||((best.resolution||'')+'P'),flag:!!best.flag,needLogin:!!best.needLogin};
}

async function jinpaiScrapeEpisodes(s,vodId){
  const out=[];
  try{
    const r=await get(s,'/detail/'+vodId,16,true);
    const html=r.html||'';
    const seen=new Set();
    const re=/\/vod\/play\/(\d+)\/(?:sid\/|[^/\s"']*\/)?(\d+)/g;
    let m;
    while((m=re.exec(html))){
      if(String(m[1])!==String(vodId)) continue;
      const nid=String(m[2]);
      if(seen.has(nid)) continue;
      seen.add(nid);
      out.push({nid,name:String(out.length+1)});
    }
    try{
      const re2=/href="\/vod\/play\/\d+\/sid\/(\d+)"[^>]*>([^<]{1,20})</g;
      let m2; const names={};
      while((m2=re2.exec(html))){ names[m2[1]]=clean(m2[2]); }
      out.forEach(ep=>{ if(names[ep.nid]) ep.name=names[ep.nid]; });
    }catch(e){}
  }catch(e){}
  return out;
}

  // 2) 如果 API 没拿到分集，直接从 HTML 详情页里抓所有 /vod/play/ 链接

const queue = slots.slice();
async function worker(){

]);


  // 5) 没有真实链接的，用官网播放页兜底，保证每一集都有 url

function flarumExtract(text){
  const t=String(text||'').trim();
  if(t.charAt(0)==='{'){ try{ return JSON.parse(t); }catch(e){} }
  const m=t.match(/<script id="flarum-json-payload"[^>]*>([\s\S]*?)<\/script>/i);
  if(m){
    try{ const o=JSON.parse(m[1]); if(o&&o.apiDocument) return o.apiDocument; }catch(e){}
  }
  return null;
}

function parseNavCats(d){
  const out=[],seen=new Set();
  const idFrom=(href)=>{
    let m;
    if(m=href.match(/\/vodshow\/(\d+)[-_\/.]/i))return m[1];
    if(m=href.match(/\/vodtype\/(\d+)/i))return m[1];
    if(m=href.match(/\/(?:type|show)\/id\/(\d+)/i))return m[1];
    if(m=href.match(/\/vod\/show\/id\/(\d+)/i))return m[1];
    if(m=href.match(/[?&](?:type|tid|id)=(\d+)/i))return m[1];
    if(m=href.match(/\/show\/(\d+)[-_\/.]/i))return m[1];
    if(m=href.match(/\/category\/([^\/?#]+)/i)){
  try{return decodeURIComponent(m[1])}catch(e){return m[1]}
}
    return '';
  };
  let anchors=[];
  const navSel=['.module-nav a','.stui-header__menu a','.nav-menu a','.navbar-nav a','.head-nav a','header nav a','#nav a','.nav a'];
  for(const sel of navSel){const els=d.querySelectorAll(sel);if(els.length){anchors=[...els];break}}
  if(!anchors.length)anchors=[...d.querySelectorAll('a[href]')];
  anchors.forEach(a=>{
    const href=a.getAttribute('href')||'';
    const id=idFrom(href);
    if(!id||seen.has(id))return;
    let name=clean(a.textContent);
    if(!name||name.length>8)return;
    if(/首页|排行|榜单|热门|最新|专题|留言|演员|明星|求片|公告|APP|下载|登录|注册|会员|搜索|关于|友情|链接/.test(name))return;
    seen.add(id);out.push([id,name]);
  });
  return out.slice(0,24);
}

    const url=/^https?:\/\//i.test(path)?path:p3Base()+path;
    const h=p3Headers(refId||'');
    const fm=await fmReady();
    if(fm&&fm.req){
      const r=await fm.req(url,{method:'GET',responseType:'json',timeout:20,headers:h,credentials:'include'});
      if(!r.ok)throw new Error(r.error||('HTTP '+r.status));
      if(r.body&&r.body.success===false&&/登录|login|权限|session|token/i.test(String(r.body.message||r.body.msg||''))&&p3Auth.account&&p3Auth.password&&!p3Relogin){
        p3Relogin=true;
        try{await p3Login();}catch(e){}
      }
      if(r.body&&r.body.success===true&&Object.prototype.hasOwnProperty.call(r.body,'data')) return r.body.data;
      return r.body;
    }
    const fh=p3Headers(refId||'');
    const r=await fetch(url,{credentials:'include',headers:fh,cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const body=await p3SafeJson(r);
    if(body&&body.success===true&&Object.prototype.hasOwnProperty.call(body,'data')) return body.data;
    return body;
  }
  function p3Norm(v){
    return {
      id:String(v&&v.vod_id!=null?v.vod_id:(v&&v.id!=null?v.id:'')),
      title:String(v&&(v.vod_name||v.title)||'').trim(),
      poster:String(v&&(v.vod_pic||v.cover||v.poster||v.pic)||''),
      typeName:String(v&&v.type_name||''),
      area:String(v&&(v.vod_area||v.area)||''),
      year:String(v&&(v.vod_year!=null?v.vod_year:v.year)||'').replace(/[^0-9].*$/,''),
      meta:[v&&(v.vod_year||v.year),v&&(v.vod_area||v.area),v&&v.type_name].filter(Boolean).join(' / '),
      status:String(v&&(v.vod_remarks||v.remarks||v.status)||''),
      overview:String(v&&(v.vod_blurb||v.vod_content||v.intro||v.description)||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()
    };
  }
  function p3RowsHtml(list,base){
    return '<div class="p3-wrap">'+(Array.isArray(list)?list:[]).map(v=>{
      const x=p3Norm(v); if(!x.id||!x.title)return '';
      const href=base+'/pages/video.php?id='+encodeURIComponent(x.id);
      return '<div class="module-item p3-card" data-id="'+esc(x.id)+'"><a href="'+esc(href)+'"><img src="'+esc(x.poster)+'" data-src="'+esc(x.poster)+'" alt="'+esc(x.title)+'"><div class="module-item-title">'+esc(x.title)+'</div><div class="module-item-note">'+esc(x.status||x.meta)+'</div></a></div>';
    }).join('')+'</div>';
  }
  function p3PathInfo(path){
    const s=String(path||'');
    let m=s.match(/\/all-videos\.php\?t=([^&]+)&page=(\d+)/i);
    if(m)return {kind:'cat',cat:decodeURIComponent(m[1]),page:parseInt(m[2],10)||1};
    m=s.match(/\/all-videos\.php\?search=([^&]+)&page=(\d+)/i);
    if(m)return {kind:'search',kw:decodeURIComponent(m[1]),page:parseInt(m[2],10)||1};
    m=s.match(/\/all-videos\.php\?search=([^&]+)&(?:pg|p)=(\d+)/i);
    if(m)return {kind:'search',kw:decodeURIComponent(m[1]),page:parseInt(m[2],10)||1};
    return null;
  }

  // 用一个“虚拟 HTML”桥接盘链 API 到现有站源渲染器。
  const __woGet=get;
  get=async function(s,path,timeoutSec=16,quiet=false){
    if(s&&s.id===P3_ID){
      const info=p3PathInfo(path);
      if(info){
        // 盘链官方 API 的分类参数不是 1/2/3/4，而是 movie/drama/variety/anime。
        // 旧适配器直接把数字 slug 传给 group，结果四个分类都会命中同一份默认列表。
        const P3_GROUP_MAP={
          '1':'movie','2':'drama','3':'variety','4':'anime',
          'movie':'movie','drama':'drama','variety':'variety','anime':'anime'
        };
        const p3Group=P3_GROUP_MAP[String(info.cat)]||String(info.cat||'');
        const q=info.kind==='search'
          ? '/api/videos?search='+encodeURIComponent(info.kw)+'&page='+info.page+'&page_size=30&sort=year_desc&_t='+Date.now()
          : '/api/videos?page='+info.page+'&group='+encodeURIComponent(p3Group)+'&page_size=30&sort=year_desc&_t='+Date.now();
        let d=await p3Json(q,'');
        if(d&&d.success===false)throw new Error(d.message||d.msg||'盘链接口失败');
        let raw=[];
        if(d){
          const body=d.data!==undefined?d.data:d.list;
          if(Array.isArray(d)) raw=d;
          else if(Array.isArray(d.list)) raw=d.list;
          else if(Array.isArray(body)) raw=body;
          else if(body&&Array.isArray(body.list)) raw=body.list;
          else if(body&&Array.isArray(body.rows)) raw=body.rows;
          else if(body&&Array.isArray(body.vod_list)) raw=body.vod_list;
          else if(body&&typeof body==='object'){
            for(const k in body){
              if(Array.isArray(body[k])){ raw=body[k]; break; }
            }
          }
        }
        return {html:p3RowsHtml(raw,p3Base()),base:p3Base(),p3PageCount:(d&&d.pagecount)||1,p3Raw:d};
      }
    }
    return __woGet(s,path,timeoutSec,quiet);
  };

  // 盘链分类固定走真实 t 参数，和盘链原版一致。
  const __woCatUrl=catUrl;
  catUrl=function(s,c,p){
    if(s&&s.id===P3_ID)return '/all-videos.php?t='+encodeURIComponent(c)+'&page='+(p||1);
    return __woCatUrl(s,c,p);
  };

  const __woParseDetail=parseDetail;
  parseDetail=async function(v){
    if(!v||v.siteId!==P3_ID)return __woParseDetail(v);
    const id=String(v.id||((v.href||'').match(/[?&]id=([^&]+)/)||[])[1]||'');
    if(!id)return {info:{title:v.title||'',pic:v.pic||'',desc:v.overview||'',siteName:'盘链'},pans:[]};

    // 盘链 9.10 已切换到新详情 API：GET /api/videos/{id}。
    // 旧版这里调用 /api/pan-links/search，部分情况下服务端会返回非 JSON，
    // 原生 Gson 直接抛 MalformedJsonException，表现就是点进详情页出现错误代码。
    let data=null;
    try{
      data=await p3Json('/api/videos/'+encodeURIComponent(id),id);
    }catch(e){
      // 保留页面本身的信息，资源为空时由统一详情页兜底，不再把原生 JSON 异常直接冒泡出来。
      return {info:{title:v.title||'',pic:v.pic||'',desc:v.overview||'',siteName:'盘链'},pans:[]};
    }

    const video=(data&&data.video)||{};
    const title=stripTitleNoise(clean(video.vod_name||video.title||video.name||v.title||''));
    const pic=imgUrl(video.cover||video.poster||video.vod_pic||video.pic||v.pic||'');
    const desc=clean(video.intro||video.description||video.vod_blurb||video.vod_content||v.overview||'');
    const links=Array.isArray(data&&data.links)?data.links:[];
    const pans=[];
    links.forEach(lk=>{
      if(!lk)return;
      let type=String(lk.pan_type||lk.type||'http').toLowerCase();
      if(type==='others'||type==='other')type=lk.is_magnet?'magnet':'http';
      const url=String(lk.url||lk.link||'').trim();
      // 盘链 link-ticket 接口要求 link_id 使用真实的数值 ID；不要在这里统一转成字符串。
      const linkIdRaw=lk.id;
      const linkId=(linkIdRaw!=null && /^\d+$/.test(String(linkIdRaw)))?Number(linkIdRaw):String(linkIdRaw||'');
      if(!url&&!linkId)return;
      pans.push({
        name:'盘链 · '+(PAN_META_P3[type]||type),
        url:url,
        type:type,
        password:String(lk.password||lk.code||lk.extract_code||''),
        token:String(lk.token||lk.access_token||lk.resolve_token||''),
        linkId:linkId,
        siteName:'盘链',
        id:String(id||''),
        source:String(lk.source||'本站'),
        title:String(lk.title||lk.name||''),
        groupName:String(PAN_META_P3[type]||type),
        tier:lk.user_tier||lk.tier||0,
        state:'idle'
      });
    });

    // 进入详情页时就后台获取真实网盘地址，先完成解析再渲染资源列表。
    // 这样资源卡片首次显示时就是夸克/百度/123/UC 等真实地址，不出现占位文字。
    if(pans.length){
      let cursor=0;
      const worker=async()=>{
        while(cursor<pans.length){
          const item=pans[cursor++];
          if(!item||item.url||!(item.linkId||item.token))continue;
          try{
            const q=await p3ResolveRealUrl(Object.assign({},item,{id:String(id||'')}),true);
            if(q&&q.url){
              item.url=String(q.url);
              if(q.password&&!item.password)item.password=String(q.password);
            }
          }catch(e){
            // 单条解析失败不影响其它网盘资源继续显示。
          }
        }
      };
      await Promise.all(Array.from({length:Math.min(3,pans.length)},worker));
    }

    const seen={};
    const cleanPans=[];
    pans.forEach(item=>{
      const key=item.linkId?'id:'+item.linkId:(item.url?'url:'+item.url:'');
      if(!key||seen[key])return;
      seen[key]=1;
      cleanPans.push(item);
    });
    const rank={quark:0,baidu:1,'123':2,uc:3,'115':4,xunlei:5,aliyun:6,tianyi:7,mobile:8,pikpak:9,http:10,magnet:11};
    cleanPans.sort((a,b)=>(rank[a.type]??99)-(rank[b.type]??99));
    return {info:{title:title,pic:abs(p3Base(),pic),desc:desc,siteName:'盘链'},pans:cleanPans};
  };

  async function p3PostJson(path,body,refId){
    await p3EnsureLogin();
    const url=/^https?:\/\//i.test(path)?path:p3Base()+path;
    const h=p3Headers(refId||'');h['Content-Type']='application/json';
    const fm=await fmReady();
    if(fm&&fm.req){
      const r=await fm.req(url,{method:'POST',responseType:'json',timeout:20,headers:h,body:JSON.stringify(body||{}),credentials:'include'});
      if(!r.ok){
        const msg=(r.body&&typeof r.body==='object')?(r.body.message||r.body.msg||r.body.error||''):'';
        throw new Error(msg||r.error||('HTTP '+r.status));
      }
      if(r.body&&r.body.success===true&&Object.prototype.hasOwnProperty.call(r.body,'data')) return r.body.data;
      return r.body;
    }
    const ph=p3Headers(refId||'');
    ph['Content-Type']='application/json';
    const r=await fetch(url,{method:'POST',credentials:'include',headers:ph,body:JSON.stringify(body||{})});
    const parsed=await p3SafeJson(r);
    if(!r.ok){
      const msg=(parsed&&typeof parsed==='object')?(parsed.message||parsed.msg||parsed.error||''):'';
      throw new Error(msg||('HTTP '+r.status));
    }
    if(parsed&&parsed.success===true&&Object.prototype.hasOwnProperty.call(parsed,'data')) return parsed.data;
    return parsed;
  }
  // 盘链资源播放：优先按盘链返回的网盘类型播放；如果接口类型名称与 App
  // 的播放类型不完全一致，则根据真实 URL 自动纠正，避免“链接有效但播放器无数据”。
  function p3PlayType(item){
    const raw=String((item&&item.type)||'').trim().toLowerCase();
    const url=String((item&&item.url)||'').trim();
    const alias={
      '123pan':'123','123pan.com':'123','123':'123',
      'quarkpan':'quark','quark':'quark',
      'ucpan':'uc','uc':'uc',
      'aliyun':'aliyun','alipan':'aliyun','aliyundrive':'aliyun',
      'baidu':'baidu','baidupan':'baidu',
      'xunlei':'xunlei','thunder':'xunlei',
      '115':'115','115pan':'115',
      'tianyi':'tianyi','189':'tianyi',
      'mobile':'mobile','139':'mobile',
      'magnet':'magnet'
    };
    if(alias[raw]) return alias[raw];
    // 只有在真实 URL 能明确判断时才覆盖接口类型，避免把未知类型误判成夸克。
    if(url){
      if(/pan\.quark\.cn/i.test(url)) return 'quark';
      if(/drive\.uc\.cn|fast\.uc\.cn/i.test(url)) return 'uc';
      if(/alipan\.com|aliyundrive\.com/i.test(url)) return 'aliyun';
      if(/pan\.baidu\.com|yun\.baidu\.com/i.test(url)) return 'baidu';
      if(/cloud\.189\.cn/i.test(url)) return 'tianyi';
      if(/pan\.xunlei\.com/i.test(url)) return 'xunlei';
      if(/(?:^|\.)123pan\.cn|123[0-9a-z]*\.com/i.test(url)) return '123';
      if(/(?:^|\.)115\.com|115cdn\.com|anxia\.com/i.test(url)) return '115';
      if(/caiyun\.139\.com|yun\.139\.com|caiyun\.feixin\.10086\.cn/i.test(url)) return 'mobile';
      if(/^magnet:/i.test(url)) return 'magnet';
    }
    return raw||'';
  }
  // 盘链真实地址解析：详情页打开后可在后台逐条获取真实网盘地址。
  // linkId 使用官方 link-ticket -> link-open 流程；旧 token 资源走 resolve 接口。
  async function p3ResolveRealUrl(q,quiet){
    q=Object.assign({},q||{});
    if(q.url) return q;
    const refId=q.refId||q.detailId||q.videoId||q.id||(_currentDetailItem&&_currentDetailItem.id)||'';
    if(q.linkId){
      const linkIdNum=/^\d+$/.test(String(q.linkId))?Number(q.linkId):q.linkId;
      const tk=await p3PostJson('/api/videos/link-ticket',{link_id:linkIdNum},refId);
      const ticket=String((tk&&tk.ticket)||'');
      if(!ticket)throw new Error((tk&&tk.message)||'获取凭证失败');
      if(tk&&tk.code&&!q.password)q.password=String(tk.code);
      const opened=await p3Json('/api/videos/link-open/'+encodeURIComponent(q.linkId)+'?t='+encodeURIComponent(ticket),refId);
      if(opened&&opened.url)q.url=String(opened.url);
      else throw new Error((opened&&opened.message)||'解析失败');
    }else if(q.token){
      const r=await p3PostJson('/api/pan-links/resolve',{token:q.token},refId);
      if(r&&r.success&&r.url) q.url=String(r.url);
      else throw new Error((r&&r.message)||'解析失败');
    }
    return q;
  }

  const __woPlayPan=playPan;
  playPan=async function(p){
    if(p&&p.siteName==='盘链'){
      try{
        // 强制退出状态优先级最高，禁止任何已缓存的真实地址绕过登录。
        if(p3ForceLoggedOut){ try{toast('请先登录盘链账号');}catch(e){} return; }
        // 盘链必须处于有效登录状态才能播放。
        // 之前这里直接使用已经解析好的真实 URL，导致即使点击“清除登录”，
        // 当前页面里已有的真实地址仍然可以继续播放。
        if(!p3Logged && !p3Auth.loginValid){
          const ok=await p3EnsureLogin();
          if(!ok || (!p3Logged && !p3Auth.loginValid)){
            try{toast('请先登录盘链账号');}catch(e){}
            return;
          }
        }
        let q=Object.assign({},p);
        // token/linkId 资源先解析成真实地址，不显示解析提示。
        if(!q.url&&(q.linkId||q.token)){
          q=await p3ResolveRealUrl(q,true);
        }
        if(!q.url){ return; }
        const pt=p3PlayType(q);
        if(pt) q.type=pt;
        // 先尝试主播放器；失败后再尝试通用播放入口，最后才打开真实地址。
        try{ return await __woPlayPan(q); }catch(e1){
          const fm=await fmReady();
          const title=_currentPlaybackTitle||q.title||q.name||'';
          if(fm&&fm.play){
            try{ await fm.play(q.url.startsWith('magnet:')?q.url:'push://'+q.url,title); return; }catch(e2){}
          }
          try{ location.href=q.url; }catch(e3){}
          return;
        }
      }catch(e){
        return;
      }
    }
    return __woPlayPan(p);
  };

  // 盘链账号登录面板：复用现有“站源域名设置”弹窗，避免新增一套页面层。

    modal.insertBefore(box,modal.querySelector('.custom-modal-actions'));
    const account=box.querySelector('#p3Account'),pass=box.querySelector('#p3Password'),cookie=box.querySelector('#p3Cookie'),stateEl=box.querySelector('#p3LoginState'),accountShow=box.querySelector('#p3AccountShow');
    account.value=p3Auth.account||'';pass.value=p3Auth.password||'';cookie.value=p3Auth.cookie||'';

    if(p3Auth.loginValid && (p3Auth.account||p3Auth.cookie)){
      paint('已保存登录态，正在自动验证…',true);
      Promise.resolve(p3EnsureLogin()).then(async function(ok){
        if(ok){try{await p3RefreshIdentity();}catch(e){}}
        paint(ok?'已登录，登录信息已永久保存到本机':'登录态待重新验证',!!ok);paintAccount();
      }).catch(function(){paint('登录态待重新验证',false);});
    }
    box.querySelector('#p3LoginBtn').onclick=async()=>{
      p3ForceLoggedOut=false;
      p3Auth.account=account.value.trim();p3Auth.password=pass.value; p3Auth.cookie=cookie.value.trim();p3Auth.remember=true;p3Auth.loginValid=false;p3Auth.loginAt=0;p3Save();
      p3Logged=false;
      const btn=box.querySelector('#p3LoginBtn');btn.disabled=true;btn.textContent='登录中…';paint('正在验证账号…',false);

        setTimeout(async function(){

      p3ForceLoggedOut=true;

      p3Relogin=false;

      pass.value='';
      cookie.value='';
      accountShow.textContent='';

      toast('盘链账号、密码已彻底清除');
    };
    window.__p3PaintLogin=function(msg,ok){paint(msg,ok)};

  const __openSiteDomainConfig=openSiteDomainConfig;
  openSiteDomainConfig=async function(){
    // 盘链登录区必须严格绑定当前站源；其它站源打开域名设置时隐藏。
    const current=site();
    const isP3=!!(current&&current.id===P3_ID);
    const existing=document.getElementById('p3LoginBox');
    if(existing){
      existing.style.display=isP3?'':'none';
    }
    if(isP3){
      ensureP3LoginUI();
      const box=document.getElementById('p3LoginBox');
      if(box)box.style.display='';

const tmdbRatingCache=new Map();
async function tmdbRatingText(title,year){
  const key=tmdbCleanTitle(title)+'|'+(year||'');
  if(!tmdbCleanTitle(title))return '';
  if(tmdbRatingCache.has(key))return tmdbRatingCache.get(key);
  try{
    const item=await tmdbMatchCached(title,year);
    const n=Number(item&&item.vote_average);
    const r=n>0?n.toFixed(1):'';
    tmdbRatingCache.set(key,r);
    return r;
  }catch(e){tmdbRatingCache.set(key,'');return ''}
}

function card(v,i){
  const favOn = isFav(v);
  // 画质角标已去除：和橙色状态角标内容经常重复重叠（如"4K HDR"），不再单独展示
  // 更新状态：去掉"年份 分类"等无关词，保留 HD/4K/更新至/完结 等有意义的状态
  function stripRemarkPrefix(r,siteName){
    if(!r)return'';
    const SKIP=/^(\d{4}|电影|电视剧|剧集|动漫|综艺|短剧|纪录片|音乐|原盘)$/;
    const words=r.split(/\s+/);
    const kept=words.filter(w=>w&&!SKIP.test(w));  // 去掉分类/年份，但保留 siteName
    const result=kept.join(' ').trim();
    // 如果过滤后为空或只剩 siteName，不显示
    return (result&&result!==siteName) ? result : '';
  }
  // 在聚合模式下，只用第一个源的remark；单源时用v的remark
  const remarksToCheck = v.sources ? [v.sources[0].remark] : [v.remark];
  const st = remarksToCheck.map(r => stripRemarkPrefix(r, v.siteName)).filter(Boolean)[0] || '';
  const statusTag = ''; // 已彻底去除海报顶部状态文字，不影响其他信息显示
  // 聚合时同一资源常被多个站收录（它们被合并进 v.sources）。
  // badge 显示「N 站」，标题下方再完整列出所有来源站名，让用户一眼看到资源有多全。
  const siteNames = v.sources ? [...new Set(v.sources.map(x=>x.siteName).filter(Boolean))] : [v.siteName].filter(Boolean);
  const multi = siteNames.length>1;
  const badgeText = multi ? (siteNames.length+'站') : (siteNames[0]||v.siteName||'');
  const srcLine = multi ? `<div class="srcline">${esc(siteNames.join(' · '))}</div>` : '';
  return`
<article class="card${favOn?' is-fav':''}" data-i="${i}" data-href="${esc(v.href)}"><div class="poster">
  ${v.pic?`<img loading="lazy" decoding="async" sizes="(max-width:600px) 33vw, (max-width:1200px) 22vw, 180px" referrerpolicy="no-referrer" src="${esc(v.pic)}" data-poster-url="${esc(v.pic)}" onload="window._posterOk&&window._posterOk(this);window._posterCachedLoad&&window._posterCachedLoad(this)" onerror="window._posterFail&&window._posterFail(this)">`:'<div class="noimg">家哥真棒</div>'}
    ${statusTag}
    <span class="poster-year">${esc(extractYear(v)||'')}</span><span class="poster-update" data-update-i="${i}"></span><span class="badge">${esc(badgeText)}</span><span class="source-badge"></span></div><div class="meta"><div class="name">${esc(v.title)}</div>
    ${srcLine}
  </div></article>`
}

// 各站搜索 URL 格式各不相同（伪静态规则不同），过去只给“玩偶”配了 searchUrl、
// 其余站统一套用一个默认路径，导致服务器不认这个路径的站搜不出结果。

// 谁能返回结果就用谁，并把命中的格式持久化缓存，下次直接命中、不再逐个试。
const SEARCH_URL_TEMPLATES=[
  '/index.php/vod/search/page/{p}/wd/{kw}.html', // MacCMS10 标准伪静态
  '/vodsearch/-------------.html?wd={kw}&page={p}', // 参数走 query（玩偶式）

  '/search.html?wd={kw}'                          // 简化动态
];
// 命中格式缓存（按 siteId），持久化到 localStorage，跨会话复用
const SEARCH_URL_CACHE=(()=>{try{return JSON.parse(localStorage.getItem('wo_search_url_cache')||'{}')}catch(e){return {}}})();
function _saveSearchUrlCache(){try{localStorage.setItem('wo_search_url_cache',JSON.stringify(SEARCH_URL_CACHE))}catch(e){}}
// 搜索结果项多选择器兜底：不同模板的结果项 class 不一定是 .module-search-item
function _pickSearchEls(d,s){
  const sels=[s.searchListSelector,'.module-search-item','.module-items .module-item',
    '.module-list .module-item','.stui-vodlist__media','ul.stui-vodlist > li',
    '.stui-vodlist li','.search-list li','.vodlist li','.module-item'].filter(Boolean);
  for(const sel of sels){const els=[...d.querySelectorAll(sel)];if(els.length)return els}
  return [];
}

function normName(t){
  let s=clean(t).replace(/[《》\[\]【】（）()\s·.\-_:：|\/]/g,'');
  s=s.replace(/第[一二三四五六七八九十\d]+季|Season\s*\d+/ig,'');
  // 忽略版本/画质/规格/语言等后缀，使同一部片的不同版本（蓝光/4K/臻彩/国语…）归一到同一个名字。
  // 复合词放前面，避免「臻彩视界」被「臻彩」先匹配后残留「视界」。
  s=s.replace(/臻彩视界|臻彩|杜比视界|杜比全景声|杜比|导演剪辑版|未删减版|加长版|完整版|收藏版|纪念版|国际版|蓝光原盘|蓝光|原盘|remastered|bluray|blu-ray|remux|2160p|1080p|720p|4k|2160|1080|hdr10\+?|hdr|sdr|dovi|dolby|hevc|h\.?265|h\.?264|x265|x264|国粤双语|国粤|国语|粤语|中英双语|中英|双语|中字|英语|高清|超清|高码/ig,'');
  return s.toLowerCase();
}
// 从标题/备注里提取年份（19xx/20xx），排除 1080/2160 等分辨率数字；用于按年份合并与过滤
function extractYear(x){
  // 年份独立角标读取：优先接口年份字段，再从标题/备注兜底提取
  const direct=x&&(
    x.year||x.vod_year||x.pubdate||x.release_year||
    x.release_date||x.air_date||x.first_air_date
  );
  const dm=String(direct||'').match(/(?:19|20)\d{2}/);
  if(dm)return dm[0];
  return (String((x&&((x.title||'')+' '+(x.remark||'')))||'').match(/(?:^|[^\d])((?:19|20)\d{2})(?:[^\d]|$)/)||[])[1]||'';

function panType(u){
  u=String(u||'').toLowerCase();
  if(u.includes('pan.baidu'))return'百度';
  if(u.includes('quark'))return'夸克';
  if(u.includes('aliyun')||u.includes('alipan'))return'阿里';
  if(u.includes('xunlei'))return'迅雷';
  if(u.includes('guangya')||u.includes('光鸭')||u.includes('guangya')||/gy[a-z0-9.-]*\./.test(u))return'光鸭网盘';
  if(u.includes('115.com')||u.includes('115cdn'))return'115';
  // 123网盘官方域名较多且常变化（123684/123865/123912/123pan等），
  // 用域名模式匹配而非裸数字"123"，避免站源自家域名/广告链接被误判
  if(/123(?:\d{2,4})?\.(?:com|cn|net)|123pan\.(?:com|cn)/.test(u))return'123';
  if(u.includes('cloud.189'))return'天翼';
  if(u.includes('caiyun')||u.includes('139'))return'移动';
  if(u.includes('drive.uc.cn')||u.includes('uc123')||/(?:^|[.\/])uc\.cn/.test(u))return'UC';
  return'网盘'
}

function tmdbCleanTitle(t){

// TMDB 请求：优先走原生桥接 fm.req（App 内可直连 api.tmdb.org，绕过 WebView fetch 限制），

async function tmdbJSON(url,timeoutSec=8){

      const r=await fm.req(url,{method:'GET',headers:{},responseType:'text',timeout:timeoutSec});
      if(!r||!r.ok)throw new Error((r&&r.error)||('HTTP '+(r?r.status:'?')));

function tmdbNormForMatch(s){

// 判断 TMDB 候选结果的标题是否与查询标题足够匹配
// 规则：归一化后完全相等，或互相包含（处理"XX 第二季"清洗后与"XX"匹配的情况），
// 短标题（≤2 个有效字符）要求完全相等，避免"玩偶""孤儿"等泛标题误配到无关条目
function tmdbTitleMatches(query,candidate){
  const q=tmdbNormForMatch(query),c=tmdbNormForMatch(candidate);
  if(!q||!c)return false;
  if(q===c)return true;
  if(q.length<=2||c.length<=2)return q===c;
  return q.includes(c)||c.includes(q);
}

async function tmdbMatchItem(title,year){
  const q=tmdbCleanTitle(title);
  if(!q)return null;
  try{
    let url=`${TMDB_API}/search/multi?api_key=${TMDB_KEY}&language=zh-CN&query=${encodeURIComponent(q)}`;
    let d=await tmdbJSON(url);
    let results=d.results||[];
    const yearOf=(x)=>String(x.release_date||x.first_air_date||'').slice(0,4);
    // 标题匹配且有海报的候选
    let titleMatched=results.filter(x=>x.poster_path&&tmdbTitleMatches(q,x.title||x.name||x.original_title||x.original_name||''));
    // 有年份时：优先选「标题匹配 且 年份一致」的那一版，确保海报对应正确年份（如《鹿鼎记》1992 ≠ 2008）
    if(year){
      let exact=titleMatched.find(x=>yearOf(x)===year);
      if(exact)return exact;
    }
    if(titleMatched.length)return titleMatched[0];
    // 兜底：冷门/非英语片 TMDB 可能没有匹配的中文译名
    let withPoster=results.filter(x=>x.poster_path);
    if(year){ let ey=withPoster.find(x=>yearOf(x)===year); if(ey)return ey; }
    if(results.length<=3&&withPoster.length)return withPoster[0];

// 匹配缓存（按清洗后的标题做 key，缓存完整条目，避免重复请求；海报/更新状态共用同一份缓存）

// ===== 海报 IndexedDB 缓存系统 =====
const PosterCache={
  db:null,
  async open(){
    if(this.db)return this.db;
    return new Promise((res,rej)=>{
      const r=indexedDB.open('WanOuPosterCache',1);
      r.onupgradeneeded=e=>e.target.result.createObjectStore('img');
      r.onsuccess=e=>{this.db=e.target.result;res(this.db)};
      r.onerror=rej;
    });
  },
  async get(url){
    try{
      const db=await this.open();
      return await new Promise((res,rej)=>{
        const q=db.transaction('img').objectStore('img').get(url);
        q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null);
      });
    }catch(e){return null}
  },
  async set(url,blob){
    try{
      const db=await this.open();
      db.transaction('img','readwrite').objectStore('img').put(blob,url);
    }catch(e){}
  },
  async clear(){
    try{const db=await this.open();db.transaction('img','readwrite').objectStore('img').clear()}catch(e){}
  }
};
const _posterCacheFetches=new Set();
const _posterObjectUrls=new Set();
window._posterCachedLoad=async function(img){
  if(!img||img.dataset.cacheDone)return;
  const url=img.dataset.posterUrl||img.src;
  if(!url)return;
  img.dataset.cacheDone='1';
  const old=await PosterCache.get(url);
  if(old){
    const objectUrl=URL.createObjectURL(old);_posterObjectUrls.add(objectUrl);
    img.src=objectUrl;
    return;
  }
  // 同一海报在多张卡/预加载器中只发起一次缓存请求，避免重复下载占用流量
  if(_posterCacheFetches.has(url))return;
  _posterCacheFetches.add(url);
  fetch(url,{mode:'cors'}).then(r=>{if(!r.ok)throw new Error('poster cache HTTP '+r.status);return r.blob()}).then(b=>{
    if(b&&b.size) return PosterCache.set(url,b);
  }).catch(()=>{}).finally(()=>_posterCacheFetches.delete(url));
};


// ===== 海报智能预加载增强：提前加载当前屏幕后面的12张 =====
window.PosterPreloader={
  busy:{},
  preload(list,start,count){
    if(!list||!list.length)return;
    const end=Math.min(list.length,start+count);
    for(let i=start;i<end;i++){
      const v=list[i];
      if(!v||!v.pic||this.busy[v.pic])continue;
      this.busy[v.pic]=1;
      const img=new Image();
      img.decoding='async';
      img.onload=()=>{
        try{
          // 提前写入 IndexedDB，让正式显示时直接命中缓存
          fetch(v.pic,{mode:'cors'}).then(r=>r.blob()).then(b=>PosterCache.set(v.pic,b)).catch(()=>{});
        }catch(e){}
      };
      img.onerror=()=>{};
      img.src=v.pic;
    }
  },
  bind(list){
    // 列表更新时只替换当前数据，不重复注册 scroll 监听，避免越用越卡
    this.currentList=list||[];
    if(this._bound){this._schedule&&this._schedule();return}
    let timer=0;
    const run=()=>{
      const cards=document.querySelectorAll('#content .card');
      let first=0;
      for(let i=0;i<cards.length;i++){
        const r=cards[i].getBoundingClientRect();
        if(r.bottom>=0){first=i;break}
      }
      this.preload(this.currentList,first+8,8);
    };
    this._schedule=()=>{clearTimeout(timer);timer=setTimeout(run,140)};
    window.addEventListener('scroll',this._schedule,{passive:true});
    window.addEventListener('resize',this._schedule,{passive:true});
    this._bound=true;run();
  }
};

// 探测一张卡点进去到底有没有网盘：抓详情页 HTML，跑网盘域名正则。
// 返回 {ok:是否成功抓到详情, has:是否含网盘链接}。最多查前 3 个源，命中即停。
const _PAN_TEST=/https?:\/\/(?:[\w.-]*\.)?(?:pan\.baidu\.com|pan\.quark\.cn|drive\.uc\.cn|aliyundrive\.com|alipan\.com|aliyunpan\.com|cloud\.189\.cn|115\.com|115cdn\.[a-z0-9]+|123[a-z0-9]*\.(?:com|cn|net)|caiyun\.139\.com|pan\.xunlei\.com|mypikpak\.com|lanzou[a-z]*\.[a-z]+|feijipan\.com)\//i;
const _panProbeCache=new Map();   // 按 href 缓存探测结果，避免和详情页打开重复抓
async function probePan(v){
  const sources=(v.sources||[v]).slice(0,3);
  let anyOk=false;
  for(const src of sources){
    const ck=src.href;
    if(ck&&_panProbeCache.has(ck)){ if(_panProbeCache.get(ck)) return {ok:true,has:true}; anyOk=true; continue; }
    try{
      const s=SITES.find(x=>x.id===src.siteId)||site();
      const r=await get(s,src.href,8,true);
      anyOk=true;
      const RAW=(r.html||'').replace(/\\\//g,'/');
      const hit=_PAN_TEST.test(RAW);
      if(ck)_panProbeCache.set(ck,hit);
      if(hit)return {ok:true,has:true};
    }catch(e){ if(ck)_panProbeCache.set(ck,false); }
  }
  return {ok:anyOk,has:false};
}

  await Promise.all(Array.from({length:CONC},worker));
}

  diskTypes:['quark','aliyun','baidu','uc','tianyi','xunlei','123','115','mobile','guangya','magnet','ed2k'],
  panChannels:[],
  panPlugins:[]
};
const PAN_SOURCE_CONFIG={channels:[],plugins:[]};
try{
  const cache=JSON.parse(localStorage.getItem('wo_pan_source_cache')||'{}');
  if(Array.isArray(cache.channels))PAN_SOURCE_CONFIG.channels=cache.channels;
  if(Array.isArray(cache.plugins))PAN_SOURCE_CONFIG.plugins=cache.plugins;
}catch(e){}
// 盘搜地址持久化：优先恢复用户上次手动选择的地址。
// 不再把旧域名强制替换成默认域名，避免用户选择 https://so.252035.xyz 后退出重进又恢复第一个地址。
try{
  const saved=localStorage.getItem('wo_pan_api');
  if(saved && saved.trim()){
    PAN_CONFIG.apiBase=saved.trim();
  }else{
    localStorage.setItem('wo_pan_api',PAN_DEFAULT_API);
  }
}catch(e){}
try{ const t=JSON.parse(localStorage.getItem('wo_pan_types')||'null'); if(Array.isArray(t)&&t.length) PAN_CONFIG.diskTypes=t; }catch(e){}
try{ const c=JSON.parse(localStorage.getItem('wo_pan_channels')||'null'); if(Array.isArray(c)) PAN_CONFIG.panChannels=c; }catch(e){}
try{ const p=JSON.parse(localStorage.getItem('wo_pan_plugins')||'null'); if(Array.isArray(p)) PAN_CONFIG.panPlugins=p; }catch(e){}
// 一次性迁移：把新增类型补进老用户已保存的选择里（每个类型只补一次，之后尊重用户勾选）
try{
  if(localStorage.getItem('wo_pan_types')){
    let migrated=[]; try{migrated=JSON.parse(localStorage.getItem('wo_pan_types_migrated')||'[]')}catch(_){}
    if(!Array.isArray(migrated))migrated=[];
    // 兼容旧的磁力迁移标记：视为 magnet/ed2k 已迁移
    if(localStorage.getItem('wo_pan_magnet_migrated')==='1'){['magnet','ed2k'].forEach(t=>{if(migrated.indexOf(t)===-1)migrated.push(t)})}
    let changed=false;
    ['magnet','ed2k','guangya'].forEach(t=>{
      if(migrated.indexOf(t)===-1){
        if(PAN_CONFIG.diskTypes.indexOf(t)===-1){PAN_CONFIG.diskTypes.push(t);changed=true}
        migrated.push(t);
      }
    });
    if(changed) localStorage.setItem('wo_pan_types',JSON.stringify(PAN_CONFIG.diskTypes));
    localStorage.setItem('wo_pan_types_migrated',JSON.stringify(migrated));
  }
}catch(e){}
// 全部可选网盘类型（顺序即弹窗里的排列顺序）
const PAN_ALL_TYPES=['quark','aliyun','baidu','uc','tianyi','xunlei','123','115','mobile','guangya','magnet','ed2k'];
const PAN_TYPE_LABEL={quark:'夸克',aliyun:'阿里',baidu:'百度',uc:'UC',tianyi:'天翼',xunlei:'迅雷',123:'123',115:'115',mobile:'移动',guangya:'光鸭',magnet:'磁力',ed2k:'电驴'};
const PAN_CHECK_TYPES=new Set(['aliyun','quark','uc','baidu','tianyi','xunlei','115','mobile']);
function panTypeLabel(t){return PAN_TYPE_LABEL[t]||t||'网盘'}
// 盘搜设置弹窗：接口地址 + 网盘类型多选；确定后写入本地存储，返回 true 表示已保存
function openPanConfig(){
  return new Promise(async resolve=>{
    const mask=$('#panCfgMask'),input=$('#panCfgInput'),okBtn=$('#panCfgOk'),cancelBtn=$('#panCfgCancel'),resetBtn=$('#panCfgReset');
    const titleEl=mask&&mask.querySelector('.custom-modal-title');
    const sourceCfg=$('#panSourceCfg'),tabs=$('#panSourceTabs'),listEl=$('#panSourceList');
    const sourceTitle=$('#panSourceTitle'),allBtn=$('#panSourceAll'),refreshBtn=$('#panSourceRefresh');
    const channelCount=$('#panChannelCount'),pluginCount=$('#panPluginCount'),typeCount=$('#panTypeCount');
    const urlHistory=$('#panUrlHistory');
    if(!mask){resolve(false);return}
    if(titleEl) titleEl.textContent='盘搜设置';
    input.value=PAN_CONFIG.apiBase||'';
    if(urlHistory){
      urlHistory.querySelectorAll('.pan-url-item').forEach(item=>{
        item.onclick=()=>{input.value=item.textContent.trim();};
      });
      input.onfocus=()=>urlHistory.classList.add('show');
      input.onblur=()=>{setTimeout(()=>urlHistory.classList.remove('show'),150);};
    }

    if(sourceCfg) sourceCfg.style.display='block';
    if(mask.querySelector('#panTypeCfg')) mask.querySelector('#panTypeCfg').style.display='none';

    let activePane='channels';
    let channelList=Array.isArray(PAN_SOURCE_CONFIG.channels)?PAN_SOURCE_CONFIG.channels.slice():[];
    let pluginList=Array.isArray(PAN_SOURCE_CONFIG.plugins)?PAN_SOURCE_CONFIG.plugins.slice():[];
    let channelSel=new Set(PAN_CONFIG.panChannels||[]);
    let pluginSel=new Set(PAN_CONFIG.panPlugins||[]);
    let typeSel=new Set(PAN_CONFIG.diskTypes);

    const normalizeNames=(v)=>{
      if(!Array.isArray(v))return [];
      return v.map(x=>{
        if(typeof x==='string')return x.trim();
        if(x&&typeof x==='object')return String(x.name||x.id||x.channel||x.plugin||'').trim();
        return '';
      }).filter(Boolean);
    };

    const setDefaultsFromHealth=()=>{
      // TG频道和搜索插件永久默认全部勾选
      channelSel=new Set(channelList);
      pluginSel=new Set(pluginList);
      try{localStorage.setItem('wo_pan_channels',JSON.stringify(channelList));}catch(e){}
      try{localStorage.setItem('wo_pan_plugins',JSON.stringify(pluginList));}catch(e){}
    };

    const updateCounts=()=>{
      if(channelCount)channelCount.textContent=`${channelSel.size} / ${channelList.length}`;
      if(pluginCount)pluginCount.textContent=`${pluginSel.size} / ${pluginList.length}`;
      if(typeCount)typeCount.textContent=`${typeSel.size} / ${PAN_ALL_TYPES.length}`;
    };

    const paneData=()=>{
      if(activePane==='channels')return {title:'TG 频道配置',items:channelList,sel:channelSel,key:'channel'};
      if(activePane==='plugins')return {title:'搜索插件',items:pluginList,sel:pluginSel,key:'plugin'};
      return {title:'网盘类型',items:PAN_ALL_TYPES.map(x=>panTypeLabel(x)),raw:PAN_ALL_TYPES,sel:typeSel,key:'type'};
    };

    const renderPane=()=>{
      const d=paneData();
      if(sourceTitle)sourceTitle.textContent=d.title;
      if(!listEl)return;
      if(!d.items.length){
        listEl.innerHTML='<div class="pan-source-empty">暂无可用项目，点击“刷新”重新读取 PanSou 服务。</div>';
      }else{
        const raw=d.raw||d.items;
        listEl.innerHTML='<div class="pan-source-grid">'+d.items.map((name,i)=>{
          const key=raw[i];
          const on=d.sel.has(key);
          return `<button type="button" class="pan-source-chip${on?' on':''}" data-k="${esc(key)}"><span class="source-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="source-name" title="${esc(name)}">${esc(name)}</span></button>`;
        }).join('')+'</div>';
        listEl.querySelectorAll('.pan-source-chip').forEach(chip=>{
          chip.onclick=()=>{
            const key=chip.dataset.k;
            if(d.sel.has(key))d.sel.delete(key);else d.sel.add(key);
            chip.classList.toggle('on',d.sel.has(key));
            updateCounts();
            updateAllButton();
          };
        });
      }
      updateCounts();
      updateAllButton();
    };

    const updateAllButton=()=>{
      const d=paneData();
      const all=d.items.length>0 && d.sel.size>=d.items.length;
      if(allBtn)allBtn.textContent=all?'全不选':'全选';
    };

    const loadHealth=async()=>{
      if(listEl)listEl.innerHTML='<div class="pan-source-loading">正在读取 PanSou 的 TG 频道和搜索插件…</div>';
      try{
        let d=null;
        const fm=await fmReady();
        const url=panApi('/api/health');
        if(fm&&fm.req){
          const r=await fm.req(url,{method:'GET',responseType:'json',timeout:12});
          if(!r.ok)throw new Error(r.error||('HTTP '+r.status));
          d=typeof r.body==='string'?JSON.parse(r.body):r.body;
        }else{
          const r=await fetch(url,{cache:'no-store'});
          if(!r.ok)throw new Error('HTTP '+r.status);
          d=await r.json();
        }
        const root=(d&&d.data&&typeof d.data==='object')?d.data:d||{};
        const ch=normalizeNames(root.channels);
        const pl=normalizeNames(root.plugins);
        if(ch.length)channelList=ch;
        if(pl.length)pluginList=pl;
        PAN_SOURCE_CONFIG.channels=channelList.slice();
        PAN_SOURCE_CONFIG.plugins=pluginList.slice();
        try{
          localStorage.setItem('wo_pan_source_cache',JSON.stringify({channels:channelList,plugins:pluginList}));
        }catch(e){}
        setDefaultsFromHealth();
        renderPane();
      }catch(e){
        try{
          const cache=JSON.parse(localStorage.getItem('wo_pan_source_cache')||'{}');
          if(!channelList.length)channelList=normalizeNames(cache.channels);
          if(!pluginList.length)pluginList=normalizeNames(cache.plugins);
        }catch(_){}
        setDefaultsFromHealth();
        renderPane();
        if(!channelList.length&&!pluginList.length&&listEl){
          listEl.innerHTML='<div class="pan-source-empty">无法读取 PanSou 配置，请检查接口地址是否可用。</div>';
        }
      }
    };

    const switchPane=(pane)=>{
      activePane=pane;
      tabs&&tabs.querySelectorAll('.pan-source-tab').forEach(t=>t.classList.toggle('on',t.dataset.pane===pane));
      renderPane();
    };
    tabs&&tabs.querySelectorAll('.pan-source-tab').forEach(t=>{
      t.onclick=()=>switchPane(t.dataset.pane||'channels');
    });
    if(allBtn)allBtn.onclick=()=>{
      const d=paneData();
      const all=d.items.length>0&&d.sel.size>=d.items.length;
      if(all)d.sel.clear();else d.items.forEach((_,i)=>d.sel.add((d.raw||d.items)[i]));
      renderPane();
    };
    if(refreshBtn)refreshBtn.onclick=()=>loadHealth();

    setDefaultsFromHealth();
    updateCounts();
    renderPane();
    mask.classList.add('show');
    await loadHealth();

    let done=false;
    const finish=(ok)=>{
      if(done)return;done=true;
      mask.classList.remove('show');
      okBtn.onclick=null;cancelBtn.onclick=null;mask.onclick=null;input.onkeydown=null;input.onfocus=null;input.onblur=null;
      if(refreshBtn)refreshBtn.onclick=null;
      if(allBtn)allBtn.onclick=null;
      if(tabs)tabs.querySelectorAll('.pan-source-tab').forEach(t=>t.onclick=null);
      if(ok){
        const url=input.value.trim();
        if(url)PAN_CONFIG.apiBase=url;
        let arr=PAN_ALL_TYPES.filter(t=>typeSel.has(t));
        if(!arr.length)arr=PAN_ALL_TYPES.slice();
        PAN_CONFIG.diskTypes=arr;
        PAN_CONFIG.panChannels=[...channelSel];
        PAN_CONFIG.panPlugins=[...pluginSel];
        try{localStorage.setItem('wo_pan_api',PAN_CONFIG.apiBase)}catch(e){}
        try{localStorage.setItem('wo_pan_types',JSON.stringify(arr))}catch(e){}
        try{localStorage.setItem('wo_pan_channels',JSON.stringify(PAN_CONFIG.panChannels))}catch(e){}
        try{localStorage.setItem('wo_pan_plugins',JSON.stringify(PAN_CONFIG.panPlugins))}catch(e){}
      }
      resolve(ok);
    };
    if(resetBtn)resetBtn.onclick=()=>{
      input.value=PAN_DEFAULT_API;
      PAN_CONFIG.apiBase=PAN_DEFAULT_API;
      typeSel=new Set(PAN_ALL_TYPES);
      channelSel=new Set(channelList);
      pluginSel=new Set(pluginList);
      renderPane();
    };
    okBtn.onclick=()=>finish(true);
    cancelBtn.onclick=()=>finish(false);
    mask.onclick=(e)=>{if(e.target===mask)finish(false)};
    input.onkeydown=(e)=>{
      if(e.key==='Enter' && document.activeElement===input){e.preventDefault();finish(true)}
      else if(e.key==='Escape'){e.preventDefault();finish(false)}
    };
  });
}
async function panSafeJson(resp){
  const t=await resp.text();
  try{return JSON.parse(t)}catch(e){throw new Error('盘链接口返回异常:'+String(t||'').slice(0,120))}
}
function panApi(path){return PAN_CONFIG.apiBase.replace(/\/+$/,'')+path}
function panKeyword(t){return clean(String(t||'').replace(/[《》\[\]【】]/g,'').replace(/[(（].*?[)）]/g,''))}
function panNormUrl(u){return String(u||'').trim().replace(/[?&]+$/,'')}
async function panReq(path,body){
  const url=panApi(path);
  const fm=await fmReady();
  if(fm&&fm.req){
    let r=await fm.req(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),responseType:'json',timeout:12});
    if(!r.ok)throw new Error(r.error||('HTTP '+r.status));
    return typeof r.body==='string'?JSON.parse(r.body):r.body;
  }
  let resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok)throw new Error('HTTP '+resp.status);
  return await panSafeJson(resp);
}
async function panSearch(kw){
  // 搜索前强制使用全部 TG 频道和全部搜索插件（与 35.0 一致，速度更快）
  try{
    if(Array.isArray(PAN_SOURCE_CONFIG.channels) && PAN_SOURCE_CONFIG.channels.length){
      PAN_CONFIG.panChannels = PAN_SOURCE_CONFIG.channels.map(x=>typeof x==='string'?x:(x.id||x.name||x.channel||'')).filter(Boolean);
    }
    if(Array.isArray(PAN_SOURCE_CONFIG.plugins) && PAN_SOURCE_CONFIG.plugins.length){
      PAN_CONFIG.panPlugins = PAN_SOURCE_CONFIG.plugins.map(x=>typeof x==='string'?x:(x.id||x.name||x.plugin||'')).filter(Boolean);
    }
  }catch(e){}
  const channels=Array.isArray(PAN_CONFIG.panChannels)?PAN_CONFIG.panChannels.filter(Boolean):[];
  const plugins=Array.isArray(PAN_CONFIG.panPlugins)?PAN_CONFIG.panPlugins.filter(Boolean):[];
  const body={kw,res:'merge',cloud_types:PAN_CONFIG.diskTypes};
  if(channels.length&&plugins.length){body.src='all';body.channels=channels;body.plugins=plugins}
  else if(channels.length){body.src='tg';body.channels=channels}
  else if(plugins.length){body.src='plugin';body.plugins=plugins}
  else{body.src='all'}
  const data=await panReq('/api/search',body);
  const byType=(data&&data.data&&data.data.merged_by_type)||(data&&data.merged_by_type)||{};
  let out=[];
  Object.keys(byType).forEach(type=>{
    if(PAN_CONFIG.diskTypes.indexOf(type)===-1)return;
    (byType[type]||[]).forEach(item=>{
      const url=item.url||item.share_url||'';
      if(!url)return;
      out.push({
        type,
        title:clean(item.note||item.title||item.name||kw),
        url,
        password:item.password||item.pwd||'',
        datetime:item.datetime||item.time||''
      });
    });
  });
  let seen=new Set(),dedup=[];
  out.forEach(x=>{const k=x.type+'|'+panNormUrl(x.url);if(!seen.has(k)){seen.add(k);dedup.push(x)}});
  dedup.forEach((x,i)=>{x._q=panQualityScore(x.title);x._i=i});
  dedup.sort((a,b)=>b._q-a._q||a._i-b._i);
  return dedup;
}
// 画质/版本关键词打分：标题里命中的关键词越多，分数越高，排序越靠前
const PAN_QUALITY_KEYWORDS=[
  {k:['dolby vision','dovi','杜比视界','dv'],s:100},
  {k:['hdr10+','hdr10plus'],s:90},
  {k:['hdr10','hdr','hlg'],s:80},
  {k:['4k','2160p','uhd','8k'],s:70},
  {k:['remux','蓝光原盘','原盘','bluray','blu-ray'],s:65},
  {k:['高码率','高码','x265','h265','hevc'],s:55},
  {k:['杜比全景声','dolby atmos','atmos'],s:50},
  {k:['1080p','1080i','fhd'],s:40},
  {k:['60fps','60帧'],s:30},
  {k:['720p'],s:20},
  {k:['web-dl','webdl','bdrip'],s:15},
  {k:['国语','粤语','国粤','中字','双语'],s:5}
];
function panQualityScore(title){
  const t=String(title||'').toLowerCase();
  let score=0;
  PAN_QUALITY_KEYWORDS.forEach(row=>{
    if(row.k.some(k=>t.includes(k.toLowerCase()))) score+=row.s;
  });
  return score;
}

function panQualityTags(title){
  const t=String(title||'').toLowerCase();
  const tags=[];
  if(/dolby.?vision|dovi|杜比视界|dv/.test(t)) tags.push('杜比视界');
  if(/hdr10\+|hdr10plus/.test(t)) tags.push('HDR10+');
  else if(/hdr/.test(t)) tags.push('HDR');
  if(/4k|2160p|uhd|8k/.test(t)) tags.push('4K');
  if(/remux|蓝光原盘|bluray|blu-ray|原盘/.test(t)) tags.push('蓝光');
  if(/高码率|高码|h265|hevc|x265/.test(t)) tags.push('高码');
  if(/1080p|1080i/.test(t)) tags.push('1080P');
  if(/60fps|60帧/.test(t)) tags.push('60帧');
  return tags.slice(0,3);
}
// 盘搜类型标签排序优先级；未列出的按全量清单顺序排在后面
const PAN_TYPE_ORDER=['quark','baidu','uc','mobile','tianyi','189','123','115','aliyun','xunlei','weiyun'];
function panTypeRank(t){
  const i=PAN_TYPE_ORDER.indexOf(t);
  if(i>=0)return i;
  const j=PAN_ALL_TYPES.indexOf(t);
  return 100+(j<0?99:j);
}
// ===== 新增：盘搜健康检测缓存 & 有效条数统计 =====
const panSearchHealthCache=new Map();
function panSearchKey(p){return String(p.type||'')+'|'+String(p.url||'')+'|'+String(p.password||'');}
function panBadState(s){return s==='bad'||s==='locked'||s==='uncertain';}
function panSearchCount(list,type){
  return list.filter(p=>p.type===type&&!panBadState(panSearchHealthCache.get(panSearchKey(p)))).length;
}
function updatePanSearchCounts(box,allList){
  box.querySelectorAll('.pan-search-tab').forEach(btn=>{
    const label=btn.dataset.label||'';
    btn.textContent=label+' '+panSearchCount(allList,btn.dataset.type);
  });
}
function panTypesPresent(list){
  let m=new Map();
  list.forEach(x=>m.set(x.type,(m.get(x.type)||0)+1));
  return[...m.entries()].sort((a,b)=>panTypeRank(a[0])-panTypeRank(b[0]));
}
function renderPanSearchBox(box,allList,activeType){
  if(!box)return;
  // 保存盘搜源标签横向滚动位置，避免切换阿里/UC/迅雷等后重新渲染跳回夸克
  const oldTabs=box.querySelector('.pan-search-tabs');
  const oldScrollLeft=oldTabs?oldTabs.scrollLeft:0;
  if(!allList.length){
    box.innerHTML='<div class="pan-search-status">未搜索到资源</div>';
    return;
  }
  const types=panTypesPresent(allList);
  if(!activeType||!types.some(t=>t[0]===activeType))activeType=types[0][0];
  const tabsHtml=types.map(([t,n])=>`<button class="pan-search-tab${t===activeType?' active':''}" data-type="${esc(t)}" data-label="${esc(panTypeLabel(t))}">${esc(panTypeLabel(t))} ${panSearchCount(allList,t)}</button>`).join('')+`<button class="pan-search-cfg" type="button">设置</button>`;
  const list=allList.filter(x=>x.type===activeType);
  box.innerHTML=`
<div class="pan-search-tabs">${tabsHtml}</div><div class="pan-list">
${list.map(p=>`
<div class="pan-item" data-type="${esc(p.type)}" data-url="${esc(p.url)}" data-pwd="${esc(p.password)}" data-title="${esc(p.title)}"><span class="pan-health-dot" data-state="${PAN_CHECK_TYPES.has(p.type)?'idle':'unsupported'}"></span><div class="pan-info"><div class="pan-name">${esc(p.name||p.title)}</div><div class="pan-quality-tags">${panQualityTags(p.title).map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="pan-url">${esc(p.url)}${p.password?' · 提取码 '+esc(p.password):''}</div></div></div>`).join('')}
</div>`;
  // 恢复用户之前滑动到的位置（只恢复源标签栏，不影响内容列表）
  const newTabs=box.querySelector('.pan-search-tabs');
  if(newTabs){
    newTabs.scrollLeft=oldScrollLeft;
    requestAnimationFrame(()=>{newTabs.scrollLeft=oldScrollLeft;});
  }
  const cfg=box.querySelector('.pan-search-cfg');
  if(cfg) cfg.onclick=(e)=>{e.stopPropagation();openPanConfig().then(ok=>{if(ok) renderPanSearchBox(box,allList,activeType);});};
  box.querySelectorAll('.pan-search-tab').forEach(btn=>{
    btn.onclick=(e)=>{e.stopPropagation();renderPanSearchBox(box,allList,btn.dataset.type)};
  });
  box.querySelectorAll('.copy-btn').forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();copyText(btn.dataset.link)});
  // ✅ 正确代码：调用已定义的 playPan
box.querySelectorAll('.pan-item').forEach(item=>{
  item.onclick=(e)=>{playPanSearch({type:item.dataset.type,url:item.dataset.url,password:item.dataset.pwd,title:item.dataset.title})};
});
panHealthCheck(box,list,allList);
}
// 按路灯（健康检测）结果过滤：仅隐藏“确认非有效”的（失效/需权限/测不准）；
// 绿灯有效、尚未检测(idle)、无法检测(unsupported，如磁力/电驴) 一律保留
function applyPanHealthFilter(box,allList){
  if(!box)return;
  let shown=0;
  box.querySelectorAll('.pan-item').forEach(it=>{
    const dot=it.querySelector('.pan-health-dot');
    const st=dot?dot.dataset.state:'';
    const hide=(st==='bad'||st==='locked'||st==='uncertain');
    it.style.display=hide?'none':'';
    if(!hide)shown++;
  });
  const at=box.querySelector('.pan-search-tab.active');
  if(at&&at.dataset.label)at.textContent=at.dataset.label+' '+shown;
  if(Array.isArray(allList))updatePanSearchCounts(box,allList);
  let note=box.querySelector('.pan-empty-note');
  if(shown===0){
    const listEl=box.querySelector('.pan-list');
    if(!note&&listEl){note=document.createElement('div');note.className='pan-search-status pan-empty-note';listEl.appendChild(note)}
    if(note)note.textContent='该类暂无有效资源';
  }else if(note){note.remove()}
}

function mediaTypeLabel(t){return t==='tv'?'剧集':t==='movie'?'电影':''}
function tmdbSuggest(q){
  const key=q.toLowerCase();
  if(_suggCache.has(key))return _suggCache.get(key);
  const url=`${TMDB_API}/search/multi?api_key=${TMDB_KEY}&language=zh-CN&include_adult=false&page=1&query=${encodeURIComponent(q)}`;
  const p=tmdbJSON(url).then(d=>(d.results||[])
    .filter(x=>x.media_type==='movie'||x.media_type==='tv')
    .map(x=>({
      title:x.title||x.name||x.original_title||x.original_name||'',
      year:(x.release_date||x.first_air_date||'').slice(0,4),
      poster:x.poster_path?TMDB_IMG_SUGG+x.poster_path:'',
      type:x.media_type,
      pop:x.popularity||0
    }))
    .filter(x=>x.title)
    .sort((a,b)=>b.pop-a.pop)
    .slice(0,8)
  ).catch(()=>[]);
  _suggCache.set(key,p);
  return p;
}

async function onSuggInput(){
  const q=kw.value.trim();
  const minLen=/[\u4e00-\u9fa5]/.test(q)?1:2;
  if(q.length<minLen){hideSugg();return}
  const seq=++_suggSeq;
  try{
    const list=await tmdbSuggest(q);
    if(seq!==_suggSeq)return;            // 丢弃过期请求
    if(kw.value.trim()!==q)return;       // 输入已变化

    renderSugg(sorted.slice(0,8));

  if(!btn)return;
  const KEY='wo_backtop_pos';
  // 还原上次拖动后的位置
  function applyPos(p){
    if(!p)return;
    btn.style.top=p.top+'px';btn.style.bottom='auto';
    if(p.edge==='left'){btn.style.left='0';btn.style.right='auto';btn.classList.add('left')}
    else{btn.style.right='0';btn.style.left='auto';btn.classList.remove('left')}
  }
  let _saved=null;try{_saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(_saved)applyPos(_saved);
  // 滚动约 4 排后出现（原 9 排过晚）
  function getThreshold(){const cardH=(window.innerWidth/3)*(4/3)+52;return cardH*4}
  let _ticking=false;
  function onScroll(){
    if(_ticking)return;_ticking=true;
    requestAnimationFrame(()=>{
      const y=window.scrollY||document.documentElement.scrollTop;
      btn.classList.toggle('show',y>getThreshold());
      _ticking=false;
    });
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  // 拖动逻辑：拖动结束按就近吸附到左/右边缘并记忆
  let dragging=false,moved=false,sx=0,sy=0,ox=0,oy=0,curX=0,curY=0,justDragged=false;
  const sz=()=>btn.offsetWidth||50;
  function down(e){
    const t=e.touches?e.touches[0]:e;
    const r=btn.getBoundingClientRect();
    dragging=true;moved=false;ox=r.left;oy=r.top;sx=t.clientX;sy=t.clientY;
    btn.classList.add('dragging');
  }
  function move(e){
    if(!dragging)return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(!moved&&(Math.abs(dx)>6||Math.abs(dy)>6))moved=true;
    if(!moved)return;
    if(e.cancelable)e.preventDefault();
    const S=sz();
    curX=Math.max(0,Math.min(window.innerWidth-S,ox+dx));
    curY=Math.max(60,Math.min(window.innerHeight-S-10,oy+dy));
    btn.style.left=curX+'px';btn.style.right='auto';
    btn.style.top=curY+'px';btn.style.bottom='auto';
  }
  function up(){
    if(!dragging)return;
    dragging=false;btn.classList.remove('dragging');
    if(!moved)return;                       // 视为点按，交给 click 处理（回顶）
    justDragged=true;setTimeout(()=>{justDragged=false},400);
    const S=sz();
    const left=(curX+S/2)<window.innerWidth/2;
    const top=Math.max(60,Math.min(window.innerHeight-S-10,curY));
    const p={edge:left?'left':'right',top};
    applyPos(p);
    try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}
  }
  btn.addEventListener('touchstart',down,{passive:true});
  btn.addEventListener('touchmove',move,{passive:false});
  btn.addEventListener('touchend',up,{passive:true});
  btn.addEventListener('touchcancel',()=>{dragging=false;btn.classList.remove('dragging')},{passive:true});
  // 桌面端鼠标拖动
  btn.addEventListener('mousedown',e=>{
    down(e);
    const mm=ev=>move(ev),mu=ev=>{up(ev);document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu)};
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
  btn.addEventListener('click',e=>{
    if(justDragged){e.preventDefault();e.stopPropagation();justDragged=false;return}
    window.scrollTo({top:0,behavior:'smooth'});
  });
  // 切页/切分类时隐藏
  window._backTopReset=function(){ btn.classList.remove('show') };
})();

(function(){
  if(!content)return;
  let x0=0,y0=0,t0=0,tracking=false,decided=false,horizontal=false;
  let lpTimer=null,lpCard=null;
  const TH=56;        // 触发切换的最小水平位移
  const SLOP=12;      // 判定方向前的容差
  const MAXT=600;     // 超过此时长视为拖拽/犹豫，不触发
  const LP=600;       // 长按触发收藏的时长(ms)，调长以避免轻点被误判为收藏
  // 仅在分类浏览态可滑：搜索结果页、详情页、搜索聚焦态一律不响应
  function swipable(){

      && !$('#sheet').classList.contains('active')
      && !document.documentElement.classList.contains('search-focused');
  }
  // 长按收藏：分类页与搜索结果页都允许（详情页/搜索聚焦态除外）
  function cardActive(){
    return !$('#sheet').classList.contains('active')
      && !document.documentElement.classList.contains('search-focused');
  }
  function clearLP(){ if(lpTimer){clearTimeout(lpTimer);lpTimer=null} lpCard=null; }
  function edgeBounce(dir){
    content.classList.remove('edge-l','edge-r');
    void content.offsetWidth;                       // 重启动画
    content.classList.add(dir>0?'edge-l':'edge-r');
    content.addEventListener('animationend',()=>content.classList.remove('edge-l','edge-r'),{once:true});
  }
  // dir = +1 下一类（手指向左滑），-1 上一类（手指向右滑）
  function go(dir){
    const cats=effCats(site());
    let i=cats.findIndex(c=>c[0]===activeCat);
    if(i<0)i=0;
    const n=i+dir;
    if(n<0||n>=cats.length){edgeBounce(dir);return}
    activateCategory(cats[n][0], dir>0?'l':'r');
  }
  // 横向切换手势隔离：只允许海报内容区域触发，不监听整页
  let navGestureLock=false;

    const t=e.target;
    return !!(t && t.closest && t.closest('.navrow,.src-row,.chips'));
  }
  function isGridTouch(e){
    const t=e.target;
    return !!(t && t.closest && t.closest('.grid'));

    el.style.touchAction='pan-x';
    el.style.overscrollBehaviorX='contain';

    if(e.target && e.target.closest && e.target.closest('.grid')){
      e.stopPropagation();
    }

    if(e.touches.length!==1){tracking=false;return}
    const t=e.touches[0];

    if(cardActive()&&e.target.closest){

          if(!card)return;                                 // 防御：已被清理则不处理
          const item=(last||[]).find(x=>x.href===card.dataset.href);

            _swiped=true;                                  // 一次性：仅拦截这次长按抬手产生的 click
            if(navigator.vibrate){try{navigator.vibrate(15)}catch(_){}}
            // 浏览历史页面：长按改为删除，不再触发收藏
            if(activeCat==='history' || activeCat==='fav'){
              window.__historyLongDelete=true;
              const list = activeCat==='history' ? historyList : favList;
              const idx=list.findIndex(x=>x.href===item.href);
              if(idx>-1){
                showHistoryDeleteModal(function(ok){
                  if(!ok)return;
                  list.splice(idx,1);
                  if(activeCat==='history'){
                    saveHistory();

                  }else{

                  }

              }

              if(false){

  content.addEventListener('touchmove',e=>{
    if(navGestureLock){tracking=false;return;}
    const t=e.touches[0];
    const dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>8||Math.abs(dy)>8)clearLP();    // 一旦移动即取消长按

      if(Math.abs(dx)<SLOP&&Math.abs(dy)<SLOP)return;

  content.addEventListener('touchend',e=>{

    if(window.__historyLongDelete){
      window.__historyLongDelete=false;
      e.stopPropagation();
      e.preventDefault();
      return;
    }
    if(_swiped){_swiped=false;e.stopPropagation();e.preventDefault()}
  },true);
})();

(function(){
  'use strict';
  const THEME_KEY='wo_theme';
  const btn=document.querySelector('.search .btn.primary');
  if(!btn)return;
  // 主题列表：cls 为空字符串代表默认橙色主题（不附加 class）
  const THEMES=[
    {cls:'',            name:'默认橙色'},
    {cls:'neon',        name:'霓虹蓝'},
    {cls:'theme-amber', name:'琥珀金'},
    {cls:'theme-rose',  name:'玫瑰金'},
    {cls:'theme-indigo',name:'午夜蓝紫'},
    {cls:'theme-teal',  name:'雾蓝青'},
    {cls:'theme-sand',  name:'香槛灰金'},
    {cls:'theme-jade',  name:'墨绿'}
  ];
  const THEME_CLASSES=THEMES.map(t=>t.cls).filter(Boolean);
  function applyTheme(idx){
    THEME_CLASSES.forEach(c=>document.body.classList.remove(c));
    const t=THEMES[idx];
    if(t.cls)document.body.classList.add(t.cls);
  }
  function currentIndex(){
    const i=THEMES.findIndex(t=>t.cls && document.body.classList.contains(t.cls));
    return i<0 ? 0 : i;
  }
  // 启动时读取已保存主题
  let themeIdx=0;
  try{
    const saved=parseInt(localStorage.getItem(THEME_KEY),10);
    if(!isNaN(saved)&&saved>=0&&saved<THEMES.length){
      themeIdx=saved;
      applyTheme(themeIdx);
    }
  }catch(e){}
  let toastEl=null;
  function toast(text){
    if(!toastEl){
      toastEl=document.createElement('div');
      toastEl.style.cssText='position:fixed;top:calc(var(--safe-top) + 14px);left:50%;'
        +'transform:translateX(-50%) translateY(-8px);z-index:90;'
        +'background:rgba(20,24,32,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);'
        +'border:1px solid rgba(255,255,255,.12);border-radius:999px;'
        +'padding:7px 16px;font-size:13px;font-weight:700;color:#fff;'
        +'opacity:0;transition:opacity .22s ease,transform .22s ease;pointer-events:none;white-space:nowrap';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent=text;
    toastEl.style.opacity='1';
    toastEl.style.transform='translateX(-50%) translateY(0)';
    clearTimeout(toastEl._t);
    toastEl._t=setTimeout(()=>{
      toastEl.style.opacity='0';
      toastEl.style.transform='translateX(-50%) translateY(-8px)';
    },1400);
  }
  const LP=600;       // 长按触发时长，与卡片收藏长按保持一致手感
  const MOVE_TOL=10;  // 超出此移动距离视为滑动/取消，不触发
  let timer=null,sx=0,sy=0,fired=false;
  function clear(){ if(timer){clearTimeout(timer);timer=null} }
  function start(x,y){
    fired=false;
    sx=x;sy=y;
    clear();
    timer=setTimeout(()=>{
      timer=null;fired=true;
      themeIdx=(currentIndex()+1)%THEMES.length;
      applyTheme(themeIdx);
      try{localStorage.setItem(THEME_KEY,String(themeIdx))}catch(e){}
      if(navigator.vibrate){try{navigator.vibrate([12,40,12])}catch(_){}}
      toast('已切换：'+THEMES[themeIdx].name+'主题');
    },LP);
  }
  function move(x,y){
    if(!timer)return;
    if(Math.abs(x-sx)>MOVE_TOL||Math.abs(y-sy)>MOVE_TOL)clear();
  }
  function end(e){
    clear();
    if(fired){ e.preventDefault(); e.stopPropagation(); } // 已触发主题切换，拦截这次抬手的 click/submit
  }
  btn.addEventListener('touchstart',e=>{
    const t=e.touches[0];start(t.clientX,t.clientY);
  },{passive:true});
  btn.addEventListener('touchmove',e=>{
    const t=e.touches[0];move(t.clientX,t.clientY);
  },{passive:true});
  btn.addEventListener('touchend',end,{passive:false});
  btn.addEventListener('touchcancel',clear,{passive:true});
  // 桌面端鼠标长按（便于在电脑上测试）
  btn.addEventListener('mousedown',e=>{start(e.clientX,e.clientY)});
  btn.addEventListener('mousemove',e=>{move(e.clientX,e.clientY)});
  btn.addEventListener('mouseup',end);
  btn.addEventListener('mouseleave',clear);
  // 长按触发后，阻止这次抬手连带的表单提交（搜索按钮在 <form> 内）
  btn.addEventListener('click',e=>{
    if(fired){fired=false;e.preventDefault();e.stopPropagation()}
  },true);
})();

(function(){
  if(!window.matchMedia || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;

  var active=null;
  function apply(card,e){
    var r=card.getBoundingClientRect();
    var px=(e.clientX-r.left)/r.width;   // 0..1
    var py=(e.clientY-r.top)/r.height;   // 0..1
    card.style.setProperty('--ry',((px-0.5)*2*MAX).toFixed(2)+'deg');
    card.style.setProperty('--rx',(-(py-0.5)*2*MAX).toFixed(2)+'deg');
    card.style.setProperty('--mx',(px*100).toFixed(1)+'%');
    card.style.setProperty('--my',(py*100).toFixed(1)+'%');
  }
  function clear(){
    if(active){active.classList.remove('tilt');active=null;}
  }
  content.addEventListener('mousemove',function(e){

<script id="new-dock-js">
// 必须放在 DOM 元素之后执行
(function() {
  const dock = document.getElementById('newDock');
  const slider = document.getElementById('dockSlider');
  if (!dock || !slider) return;

  const items = Array.from(dock.querySelectorAll('.dock-item'));

  function moveSlider(targetItem) {
    const dockRect = dock.getBoundingClientRect();
    const itemRect = targetItem.getBoundingClientRect();
    const itemCenterX = itemRect.left + itemRect.width / 2 - dockRect.left;
    const sliderWidth = slider.offsetWidth;
    slider.style.transform = `translateX(${itemCenterX - sliderWidth / 2}px)`;
  }

  setTimeout(() => {
    const activeItem = dock.querySelector('.dock-item.active') || items[0];
    if (activeItem) {
      activeItem.classList.add('active');
      moveSlider(activeItem);
    }
  }, 100);

  function activateItem(index) {
    if (index < 0 || index >= items.length) return;
    items.forEach(i => i.classList.remove('active'));
    items[index].classList.add('active');
    moveSlider(items[index]);
    triggerAction(items[index].dataset.action);
  }

  items.forEach((item, index) => {
    item.addEventListener('click', () => {
      activateItem(index);
    });
  });

  let startX = 0;
  let isSwiping = false;
  
  dock.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    isSwiping = true;
  }, { passive: true });

  dock.addEventListener('touchmove', (e) => {
    if (!isSwiping) return;
    const currentX = e.touches[0].clientX;
    const diff = currentX - startX;
    
    if (Math.abs(diff) > 50) {
      const currentIndex = items.findIndex(i => i.classList.contains('active'));
      if (diff > 0 && currentIndex > 0) {
        activateItem(currentIndex - 1);
      } else if (diff < 0 && currentIndex < items.length - 1) {
        activateItem(currentIndex + 1);
      }
      isSwiping = false;
    }
  }, { passive: true });

  dock.addEventListener('touchend', () => {
    isSwiping = false;
  });

  function triggerAction(action) {
    switch (action) {
      case 'home':
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (typeof loadCategory === 'function') loadCategory();
        break;
      case 'video':
        const aggBtn = document.getElementById('aggBtn');
        if (aggBtn) aggBtn.click();
        break;
      case 'calendar':
        if (typeof activateCategory === 'function') activateCategory('history');
        break;
      case 'playlist':
        if (typeof activateCategory === 'function') activateCategory('fav');
        break;
      case 'settings':
        if (typeof openSiteDomainConfig === 'function') openSiteDomainConfig();
        break;
    }
  }
})();
</script>

(function(){

  var seen=new WeakSet();

    seen.add(img);
    // 保留首屏主视觉优先级；其他列表/建议图使用浏览器原生懒加载。
    var hero=img.matches('.det-hero-img,[fetchpriority="high"]');

      if(!img.hasAttribute('loading'))img.loading='lazy';
      if(!img.hasAttribute('fetchpriority'))img.fetchPriority='low';
    }
    if(!img.hasAttribute('decoding'))img.decoding='async';
    img.addEventListener('load',function(){img.classList.add('v13-img-loaded');img.classList.remove('v13-img-failed');},{once:true});
    img.addEventListener('error',function(){img.classList.add('v13-img-failed');},{once:true});
    // 缓存命中时 load 事件可能早已发生。
    if(img.complete&&img.naturalWidth>0)img.classList.add('v13-img-loaded');
  }
  function scan(root){
    if(!root)return;
    if(root.nodeType===1&&root.tagName==='IMG')prepareImage(root);
    if(root.querySelectorAll)root.querySelectorAll('img').forEach(prepareImage);

    scan(document);
    if('MutationObserver' in window){
      var observer=new MutationObserver(function(records){records.forEach(function(record){record.addedNodes.forEach(function(node){if(node.nodeType===1)scan(node);});});});
      observer.observe(document.documentElement,{childList:true,subtree:true});

  }

<script>
/* 13.2 海报加载容错：临时网络失败时重试一次，再进入原有备用海报流程 */
(function(){
  var originalFail = window._posterFail;
  if (typeof originalFail !== 'function') return;
  window._posterFail = function(img){
    if (!img || img.dataset.posterRetrying === '1' || img.dataset.failed) {
      return originalFail(img);
    }
    var src = img.dataset.posterUrl || img.getAttribute('src');
    if (!src || /^blob:/.test(src) || /^data:/.test(src)) return originalFail(img);
    img.dataset.posterRetrying = '1';
    img.dataset.posterOriginalSrc = src;
    window.setTimeout(function(){
      if (!img.isConnected || img.dataset.ok === '1') return;
      // 再次请求原图，避免重复沿用浏览器当前失败状态
      img.removeAttribute('src');
      img.setAttribute('src', src);
    }, 650);
    // 监听这次重试结果；失败后调用原有兜底链
    var onRetryError = function(){
      img.removeEventListener('error', onRetryError);
      img.dataset.posterRetrying = '2';
      originalFail(img);
    };
    var onRetryLoad = function(){
      img.removeEventListener('load', onRetryLoad);
      img.removeEventListener('error', onRetryError);
      if (img.naturalWidth >= 50 && img.naturalHeight >= 50) {
        img.dataset.ok = '1';
        img.style.display = '';
        var card = img.closest('.card');
        var poster = card && card.querySelector('.poster');
        var ph = poster && poster.querySelector('.noimg');
        if (ph) ph.remove();
      } else {
        originalFail(img);
      }

<script id="v140-image-decode-enhancement">
/* 14.0：图片解码增强。浏览器支持时异步解码，失败不影响原图片加载流程。 */
(function(){
  function enhance(img){
    if(!img || img.tagName!=='IMG' || img.dataset.v140Decode==='1') return;
    img.dataset.v140Decode='1';
    try{ if('decoding' in img) img.decoding='async'; }catch(e){}
    // 只在图片已经加载成功后解码，避免阻塞首次请求。
    function decode(){
      if(!img.isConnected || !img.complete || !img.naturalWidth || typeof img.decode!=='function') return;
      try{ var p=img.decode(); if(p&&p.catch)p.catch(function(){}); }catch(e){}
    }
    if(img.complete) decode(); else img.addEventListener('load',decode,{once:true});
  }
  function scan(root){
    if(!root)return;
    if(root.nodeType===1 && root.tagName==='IMG') enhance(root);
    if(root.querySelectorAll) root.querySelectorAll('img').forEach(enhance);
  }
  function boot(){
    scan(document);
    if(window.MutationObserver){
      var mo=new MutationObserver(function(records){records.forEach(function(r){r.addedNodes.forEach(function(n){if(n.nodeType===1)scan(n);});});});
      mo.observe(document.documentElement,{childList:true,subtree:true});
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
